<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>행사 참여 시간 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#FAFAF7;
    --paper:#FFFFFF;
    --ink:#22262B;
    --ink-soft:#5B584F;
    --line:#DAD6CB;
    --green:#2F5233;
    --green-soft:#3F7B4F;
    --green-tint:#EAF1EA;
    --red:#C1440E;
    --red-tint:#FBEAE3;
    --muted:#9C9890;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(47,82,51,0.045) 28px),
      var(--bg);
    color:var(--ink);
    font-family:'Pretendard', -apple-system, sans-serif;
    padding-bottom:80px;
  }
  header{
    padding:32px 20px 20px;
    max-width:860px;
    margin:0 auto;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--green-soft);
    margin:0 0 6px;
  }
  h1{
    font-family:'Gowun Batang', serif;
    font-size:28px;
    margin:0 0 4px;
    line-height:1.3;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .title-edit-btn{
    font-family:'Pretendard';
    font-size:12px;
    color:var(--ink-soft);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:20px;
    padding:4px 10px;
    cursor:pointer;
  }
  .title-edit-btn:hover{border-color:var(--green-soft); color:var(--green-soft);}
  .sub{color:var(--ink-soft); font-size:14px; margin:0;}
  .hint{font-size:13px; color:var(--ink-soft); line-height:1.6;}
  main{max-width:860px; margin:0 auto; padding:0 20px;}
  section.card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
    margin-top:20px;
  }
  h2{
    font-size:15px;
    margin:0 0 16px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:8px;
  }
  h2 .tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--paper);
    background:var(--green);
    padding:2px 7px;
    border-radius:5px;
  }
  .add-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:flex-end;
  }
  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:12px; color:var(--ink-soft);}
  input[type=date], input[type=time], input[type=text]{
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:7px;
    background:var(--bg);
    color:var(--ink);
  }
  input[type=text]{font-family:'Pretendard';}
  input:focus{outline:2px solid var(--green-soft); outline-offset:1px;}
  .btn{
    font-family:'Pretendard';
    font-weight:600;
    font-size:14px;
    padding:9px 16px;
    border-radius:7px;
    border:1px solid var(--green);
    background:var(--green);
    color:#fff;
    cursor:pointer;
  }
  .btn:hover{background:var(--green-soft); border-color:var(--green-soft);}
  .btn.ghost{
    background:transparent; color:var(--ink-soft); border:1px solid var(--line);
    font-weight:500;
  }
  .btn.ghost:hover{border-color:var(--ink-soft); color:var(--ink);}
  .btn.danger{background:transparent; color:var(--red); border:1px solid var(--red-tint);}
  .btn.danger:hover{background:var(--red-tint);}
  .btn.small{padding:5px 10px; font-size:12px;}

  .date-group{margin-top:18px;}
  .date-group:first-child{margin-top:0;}
  .date-heading{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--green);
    border-bottom:1px solid var(--line);
    padding-bottom:6px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
  }
  table{width:100%; border-collapse:collapse;}
  tr.slot-row td{
    padding:9px 4px;
    border-bottom:1px dashed var(--line);
    font-size:14px;
    vertical-align:middle;
  }
  tr.slot-row.closed{color:var(--muted);}
  tr.slot-row.closed .time-val{text-decoration:line-through;}
  .time-val{font-family:'IBM Plex Mono', monospace; font-weight:600; min-width:56px; display:inline-block;}
  .badge{
    font-size:11px;
    padding:2px 8px;
    border-radius:20px;
    font-weight:600;
  }
  .badge.open{background:var(--green-tint); color:var(--green);}
  .badge.closed{background:#EEECE6; color:var(--muted);}
  .count{font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-soft);}
  .row-actions{display:flex; gap:6px; justify-content:flex-end;}
  .empty{color:var(--muted); font-size:14px; padding:10px 0;}

  .table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  #responsesTable{width:100%; min-width:760px; border-collapse:collapse; font-size:13px;}
  #responsesTable th{
    text-align:left; font-family:'IBM Plex Mono', monospace; font-weight:600;
    font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em;
    border-bottom:1px solid var(--line); padding:6px 4px;
  }
  #responsesTable td{padding:8px 4px; border-bottom:1px dashed var(--line); vertical-align:top;}
  .chip{
    display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:11px;
    background:var(--bg); border:1px solid var(--line); border-radius:5px;
    padding:1px 6px; margin:2px 4px 2px 0;
  }
  .card-head-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}

  #configNotice{
    max-width:860px; margin:20px auto 0; padding:14px 18px;
    background:var(--red-tint); border:1px solid #E9C4B0; border-radius:var(--radius);
    font-size:13px; line-height:1.6; display:none;
  }
  #configNotice code{background:#fff; padding:1px 5px; border-radius:4px;}
</style>
</head>
<body>

<div id="configNotice"></div>

<header>
  <p class="eyebrow">백데이터 · 참여자 관리</p>
  <h1 id="titleText">학교 방문 개별 상담 관리 <button class="title-edit-btn" id="editTitleBtn">이름 수정</button></h1>
  <p class="sub">시간대를 등록하고, 마감 여부를 관리하고, 참여 신청 현황을 확인합니다.</p>
</header>

<main>
  <section class="card">
    <h2><span class="tag">1</span> 시간대 추가</h2>
    <p class="sub" style="margin:-8px 0 14px;">평일 시간대만 여기서 등록하세요. 주말·공휴일은 신청 페이지에서 10~12시/13~15시/15~17시로 자동 표시됩니다.</p>
    <div class="add-row">
      <div class="field">
        <label for="inDate">날짜</label>
        <input type="date" id="inDate">
      </div>
      <div class="field">
        <label for="inTime">시간</label>
        <input type="time" id="inTime">
      </div>
      <div class="field" style="flex:1; min-width:140px;">
        <label for="inLabel">메모 (선택)</label>
        <input type="text" id="inLabel" placeholder="예: 1부 / 강당">
      </div>
      <button class="btn" id="addSlotBtn">추가</button>
    </div>
  </section>

  <section class="card">
    <div class="card-head-row">
      <h2 style="margin:0;"><span class="tag">2</span> 등록된 시간대</h2>
      <span class="sub" id="slotSummary"></span>
    </div>
    <div id="slotList"><p class="empty">아직 등록된 시간대가 없습니다.</p></div>
  </section>

  <section class="card">
    <div class="card-head-row">
      <h2 style="margin:0;"><span class="tag">3</span> 참여 신청 현황</h2>
      <div style="display:flex; gap:8px;">
        <label class="btn ghost small" for="importFileInput" style="cursor:pointer; margin:0;">
          엑셀 불러오기
          <input type="file" id="importFileInput" accept=".xlsx,.xls" style="display:none;">
        </label>
        <button class="btn ghost small" id="exportBtn">CSV 내보내기</button>
      </div>
    </div>
    <p class="hint" id="importStatus" style="display:none; margin-bottom:12px;"></p>
    <div id="responseList"><p class="empty">아직 접수된 신청이 없습니다.</p></div>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, doc, updateDoc, deleteDoc,
  onSnapshot, serverTimestamp, setDoc, getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ------------------------------------------------------------------
// 아래 firebaseConfig 값을 본인의 Firebase 프로젝트 값으로 교체하세요.
// Firebase 콘솔 > 프로젝트 설정 > 일반 > 내 앱 에서 확인할 수 있습니다.
// survey.html 에도 "동일한" 값을 넣어야 두 페이지가 같은 데이터를 공유합니다.
// Firestore 규칙은 (테스트용으로) 읽기/쓰기를 모두 허용하도록 설정해야 합니다.
// ------------------------------------------------------------------
const firebaseConfig = {
  apiKey: "AIzaSyCN5n1YDtZSmTB5en3P3FXY_jAMBB-h_YA",
  authDomain: "okya-admin.firebaseapp.com",
  projectId: "okya-admin",
  storageBucket: "okya-admin.firebasestorage.app",
  messagingSenderId: "226340731611",
  appId: "1:226340731611:web:f9621ec1462bd9d6e02afe"
};

const isConfigured = !firebaseConfig.apiKey.includes("YOUR_");
if(!isConfigured){
  const n = document.getElementById('configNotice');
  n.style.display = 'block';
  n.innerHTML = `<strong>설정이 필요합니다.</strong> 이 파일 하단의 <code>firebaseConfig</code> 값을 본인의 Firebase 프로젝트 정보로 바꿔주세요. (survey.html 도 동일하게 맞춰야 합니다)`;
}

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let slots = [];
let responses = [];

// ---------- 행사명 ----------
const titleText = document.getElementById('titleText');
const editTitleBtn = document.getElementById('editTitleBtn');
const metaRef = doc(db, 'config', 'meta');

onSnapshot(metaRef, snap => {
  const name = snap.exists() && snap.data().eventName ? snap.data().eventName : '학교 방문 개별 상담 관리';
  titleText.childNodes[0].nodeValue = name + ' ';
});

editTitleBtn.addEventListener('click', async () => {
  const current = titleText.childNodes[0].nodeValue.trim();
  const next = prompt('행사 이름을 입력하세요', current);
  if(next && next.trim()){
    await setDoc(metaRef, { eventName: next.trim() }, { merge:true });
  }
});

// ---------- 시간대 추가 ----------
document.getElementById('addSlotBtn').addEventListener('click', async () => {
  const date = document.getElementById('inDate').value;
  const time = document.getElementById('inTime').value;
  const label = document.getElementById('inLabel').value.trim();
  if(!date || !time){ alert('날짜와 시간을 모두 선택해주세요.'); return; }
  await addDoc(collection(db, 'slots'), {
    date, time, label, closed:false, createdAt: serverTimestamp()
  });
  document.getElementById('inLabel').value = '';
});

// ---------- 실시간 구독 ----------
onSnapshot(collection(db, 'slots'), snap => {
  slots = snap.docs.map(d => ({ id:d.id, ...d.data() }));
  renderSlots();
  renderResponses();
});

onSnapshot(collection(db, 'responses'), snap => {
  responses = snap.docs.map(d => ({ id:d.id, ...d.data() }));
  renderSlots();
  renderResponses();
});

function countFor(date, time){
  return responses.filter(r =>
    r.date === date && (r.time === time || (Array.isArray(r.times) && r.times.includes(time)))
  ).length;
}

function renderSlots(){
  const list = document.getElementById('slotList');
  const summary = document.getElementById('slotSummary');
  if(slots.length === 0){
    list.innerHTML = '<p class="empty">아직 등록된 시간대가 없습니다.</p>';
    summary.textContent = '';
    return;
  }
  const openCount = slots.filter(s => !s.closed).length;
  summary.textContent = `전체 ${slots.length} · 진행중 ${openCount} · 마감 ${slots.length - openCount}`;

  const byDate = {};
  slots.forEach(s => { (byDate[s.date] ||= []).push(s); });
  const dates = Object.keys(byDate).sort();

  list.innerHTML = dates.map(date => {
    const rows = byDate[date].sort((a,b) => a.time.localeCompare(b.time));
    return `
      <div class="date-group">
        <div class="date-heading"><span>${formatDate(date)}</span><span>${rows.length}개 시간대</span></div>
        <table>
          <tbody>
          ${rows.map(s => `
            <tr class="slot-row ${s.closed ? 'closed':''}">
              <td><span class="time-val">${s.time}</span></td>
              <td>${s.label || ''}</td>
              <td><span class="badge ${s.closed ? 'closed':'open'}">${s.closed ? '마감' : '진행중'}</span></td>
              <td class="count">신청 ${countFor(s.date, s.time)}명</td>
              <td>
                <div class="row-actions">
                  <button class="btn ghost small" data-toggle="${s.id}" data-closed="${s.closed}">${s.closed ? '재오픈':'마감'}</button>
                  <button class="btn danger small" data-del="${s.id}">삭제</button>
                </div>
              </td>
            </tr>
          `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }).join('');

  list.querySelectorAll('[data-toggle]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-toggle');
      const closed = btn.getAttribute('data-closed') === 'true';
      await updateDoc(doc(db, 'slots', id), { closed: !closed });
    });
  });
  list.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if(confirm('이 시간대를 삭제할까요? 신청 기록은 남아있지만 시간대 목록에서 사라집니다.')){
        await deleteDoc(doc(db, 'slots', btn.getAttribute('data-del')));
      }
    });
  });
}

function renderResponses(){
  const wrap = document.getElementById('responseList');
  if(responses.length === 0){
    wrap.innerHTML = '<p class="empty">아직 접수된 신청이 없습니다.</p>';
    return;
  }
  const sorted = [...responses].sort((a,b) => {
    const ta = a.createdAt?.toMillis ? a.createdAt.toMillis() : 0;
    const tb = b.createdAt?.toMillis ? b.createdAt.toMillis() : 0;
    return tb - ta;
  });
  wrap.innerHTML = `
    <div class="table-scroll">
    <table id="responsesTable">
      <thead><tr>
        <th>학생 성명</th><th>성별</th><th>학년</th><th>학교 이름</th><th>학교 소재지</th>
        <th>학부모 연락처</th><th>방문인원</th><th>상담방법</th><th>희망 날짜</th><th>희망 시간</th>
        <th>개인정보 동의</th><th>확정 여부</th><th>중복 허용</th><th></th>
      </tr></thead>
      <tbody>
        ${sorted.map(r => `
          <tr>
            <td>${escapeHtml(r.studentName ?? r.name ?? '')}</td>
            <td>${escapeHtml(r.gender || '')}</td>
            <td>${escapeHtml(r.grade || '')}</td>
            <td>${escapeHtml(r.schoolName || '')}</td>
            <td>${escapeHtml(r.schoolLocation || '')}</td>
            <td>${escapeHtml(r.parentPhone || '')}</td>
            <td>${escapeHtml(r.visitorCount || '')}</td>
            <td>${escapeHtml(r.consultMethod || '')}</td>
            <td>${formatDate(r.date)}</td>
            <td>${r.time ? `<span class="chip">${escapeHtml(r.time)}</span>` : (r.times||[]).map(t => `<span class="chip">${escapeHtml(t)}</span>`).join('')}</td>
            <td>${escapeHtml(r.privacyConsent || '')}</td>
            <td><button class="btn ${r.confirmed ? '' : 'ghost'} small" data-confirm="${r.id}" data-val="${r.confirmed}">${r.confirmed ? '확정' : '미확정'}</button></td>
            <td><button class="btn ${r.duplicateAllowed ? '' : 'ghost'} small" data-dup="${r.id}" data-val="${r.duplicateAllowed}">${r.duplicateAllowed ? '허용' : '제한'}</button></td>
            <td><button class="btn danger small" data-delres="${r.id}">삭제</button></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
    </div>
  `;
  wrap.querySelectorAll('[data-delres]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if(confirm('이 신청 기록을 삭제할까요?')){
        await deleteDoc(doc(db, 'responses', btn.getAttribute('data-delres')));
      }
    });
  });
  wrap.querySelectorAll('[data-confirm]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const cur = btn.getAttribute('data-val') === 'true';
      await updateDoc(doc(db, 'responses', btn.getAttribute('data-confirm')), { confirmed: !cur });
    });
  });
  wrap.querySelectorAll('[data-dup]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const cur = btn.getAttribute('data-val') === 'true';
      await updateDoc(doc(db, 'responses', btn.getAttribute('data-dup')), { duplicateAllowed: !cur });
    });
  });
}

document.getElementById('exportBtn').addEventListener('click', () => {
  if(responses.length === 0){ alert('내보낼 신청 기록이 없습니다.'); return; }
  const header = [
    '학생 성명','성별','학년','학교 이름','학교 소재지','학부모 연락처','방문인원','상담방법',
    '희망 날짜','희망 시간','개인정보 동의','상담 확정 여부','동일 시간 중복 허용 여부'
  ];
  const rows = responses.map(r => [
    r.studentName ?? r.name ?? '',
    r.gender || '',
    r.grade || '',
    r.schoolName || '',
    r.schoolLocation || '',
    r.parentPhone || '',
    r.visitorCount || '',
    r.consultMethod || '',
    r.date || '',
    r.time || (r.times||[]).join(' / '),
    r.privacyConsent || '',
    r.confirmed ? '확정' : '미확정',
    r.duplicateAllowed ? '허용' : ''
  ]);
  const csv = [header, ...rows].map(row =>
    row.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')
  ).join('\n');
  const blob = new Blob(["\uFEFF" + csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '개별상담신청현황.csv';
  a.click();
  URL.revokeObjectURL(url);
});

function formatDate(dateStr){
  if(!dateStr) return '';
  const [y,m,d] = dateStr.split('-');
  return `${parseInt(m)}월 ${parseInt(d)}일`;
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ------------------------------------------------------------------
// 엑셀 불러오기 ("신입학상담신청" 시트 기준 — 컬럼명이 다르면 못 읽어옵니다)
// ------------------------------------------------------------------
function pad2(n){ return String(n).padStart(2,'0'); }

function parseExcelDate(v){
  if(v instanceof Date && !isNaN(v)){
    return `${v.getFullYear()}-${pad2(v.getMonth()+1)}-${pad2(v.getDate())}`;
  }
  const s = String(v ?? '').trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(m){
    let mo = parseInt(m[1]), d = parseInt(m[2]), y = parseInt(m[3]);
    if(y < 100) y += 2000;
    return `${y}-${pad2(mo)}-${pad2(d)}`;
  }
  return null;
}

function normalizeTime(raw){
  const s = String(raw ?? '').trim();
  if(s.replace(/\s/g,'') === '시간협의필요') return '시간협의필요';
  const m = s.match(/(오전|오후)\s*(\d{1,2}):00\s*~\s*(\d{1,2}):00/);
  if(m) return `${m[1]} ${parseInt(m[2])}시~${parseInt(m[3])}시`;
  return null;
}

function normalizeMethod(raw){
  const s = String(raw ?? '').replace(/\s/g,'');
  if(s.includes('대면')) return '대면상담(학교방문)';
  if(s.includes('전화')) return '전화상담';
  return '';
}

function normalizeGrade(raw){
  const s = String(raw ?? '');
  if(s.includes('1학년')) return '1학년';
  if(s.includes('2학년')) return '2학년';
  if(s.includes('3학년')) return '3학년';
  return s.trim() ? '기타' : '';
}

function normalizeGender(raw){
  const s = String(raw ?? '').trim();
  if(s === '여') return '여학생';
  if(s === '남') return '남학생';
  return '';
}

document.getElementById('importFileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('importStatus');
  statusEl.style.display = 'block';
  statusEl.textContent = '엑셀 파일을 읽는 중...';

  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array', cellDates:true });
    const sheetName = wb.SheetNames.find(n => n.includes('상담신청')) || wb.SheetNames[0];
    const sheet = wb.Sheets[sheetName];
    const sheetRows = XLSX.utils.sheet_to_json(sheet, { defval:'' });

    const targetRows = sheetRows.filter(row => String(row['학생 성명'] || '').trim());
    if(targetRows.length === 0){
      statusEl.textContent = `"${sheetName}" 시트에서 학생 성명이 있는 행을 찾지 못했습니다. 컬럼명을 확인해주세요.`;
      e.target.value = '';
      return;
    }
    if(!confirm(`"${sheetName}" 시트에서 ${targetRows.length}건을 찾았습니다. 불러올까요? (이미 등록된 것과 이름·날짜·시간이 같은 건은 건너뜁니다)`)){
      e.target.value = '';
      return;
    }

    let success = 0, duplicate = 0, needsReview = [];

    for(const row of targetRows){
      const studentName = String(row['학생 성명']).trim();
      const dateStr = parseExcelDate(row['희망 날짜']);
      const time = normalizeTime(row['희망 시간']);

      if(!dateStr || !time){
        needsReview.push(`${studentName} (${!dateStr ? '날짜' : ''}${!dateStr && !time ? '·' : ''}${!time ? '시간' : ''} 형식 확인 필요)`);
        continue;
      }

      const isDuplicate = responses.some(r =>
        r.studentName === studentName && r.date === dateStr && r.time === time
      );
      if(isDuplicate){ duplicate++; continue; }

      const payload = {
        studentName,
        gender: normalizeGender(row['성별']),
        grade: normalizeGrade(row['학년']),
        schoolName: String(row['학교 이름'] || '').trim(),
        schoolLocation: String(row['학교 소재지'] || '').trim(),
        parentPhone: String(row['학부모 연락처'] || '').trim(),
        visitorCount: String(row['방문인원수'] || '').trim(),
        consultMethod: normalizeMethod(row['상담 방법']),
        date: dateStr,
        time,
        privacyConsent: String(row['개인정보 수집 및 이용에 동의'] || '').trim(),
        confirmed: String(row['상담 확정 여부'] || '').includes('확정'),
        duplicateAllowed: String(row['동일 시간 중복 허용 여부'] || '').includes('허용'),
        createdAt: serverTimestamp()
      };

      try{
        await addDoc(collection(db, 'responses'), payload);
        responses.push(payload); // 같은 파일 안에서의 중복도 바로 걸러지도록
        success++;
      }catch(err){
        needsReview.push(`${studentName} (저장 실패)`);
      }
    }

    let msg = `${success}건 가져오기 완료`;
    if(duplicate > 0) msg += ` · ${duplicate}건은 이미 등록되어 건너뜀`;
    if(needsReview.length > 0) msg += ` · 확인 필요 ${needsReview.length}건: ${needsReview.join(', ')}`;
    statusEl.textContent = msg;
  }catch(err){
    statusEl.textContent = '엑셀 파일을 읽는 중 오류가 발생했습니다: ' + err.message;
  }
  e.target.value = '';
});
</script>
