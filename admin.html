<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학교 방문 개별 상담 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#FAFAF7;
    --paper:#FFFFFF;
    --ink:#22262B;
    --ink-soft:#5B584F;
    --line:#DAD6CB;
    --green:#2F5233;
    --green-soft:#3F7B4F;
    --green-tint:#EAF1EA;
    --red:#C1440E;
    --red-tint:#FBEAE3;
    --muted:#9C9890;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(47,82,51,0.045) 28px),
      var(--bg);
    color:var(--ink);
    font-family:'Pretendard', -apple-system, sans-serif;
    padding-bottom:80px;
  }
  header{
    padding:32px 20px 20px;
    max-width:1600px;
    margin:0 auto;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--green-soft);
    margin:0 0 6px;
  }
  h1{
    font-family:'Gowun Batang', serif;
    font-size:28px;
    margin:0 0 4px;
    line-height:1.3;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .title-edit-btn{
    font-family:'Pretendard';
    font-size:12px;
    color:var(--ink-soft);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:20px;
    padding:4px 10px;
    cursor:pointer;
  }
  .title-edit-btn:hover{border-color:var(--green-soft); color:var(--green-soft);}
  .sub{color:var(--ink-soft); font-size:14px; margin:0;}
  .hint{font-size:13px; color:var(--ink-soft); line-height:1.6;}
  main{max-width:1600px; margin:0 auto; padding:0 20px;}
  section.card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
    margin-top:20px;
  }
  h2{
    font-size:15px;
    margin:0 0 16px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:8px;
  }
  h2 .tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--paper);
    background:var(--green);
    padding:2px 7px;
    border-radius:5px;
  }
  .btn{
    font-family:'Pretendard';
    font-weight:600;
    font-size:14px;
    padding:9px 16px;
    border-radius:7px;
    border:1px solid var(--green);
    background:var(--green);
    color:#fff;
    cursor:pointer;
  }
  .btn:hover{background:var(--green-soft); border-color:var(--green-soft);}
  .btn.ghost{
    background:transparent; color:var(--ink-soft); border:1px solid var(--line);
    font-weight:500;
  }
  .btn.ghost:hover{border-color:var(--ink-soft); color:var(--ink);}
  .btn.danger{background:transparent; color:var(--red); border:1px solid var(--red-tint);}
  .btn.danger:hover{background:var(--red-tint);}
  .btn.small{padding:5px 10px; font-size:12px;}
  .empty{color:var(--muted); font-size:14px; padding:10px 0;}

  .table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  #responsesTable{width:100%; min-width:1080px; border-collapse:collapse; font-size:13px;}
  #responsesTable th{
    text-align:left; font-family:'IBM Plex Mono', monospace; font-weight:600;
    font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em;
    border-bottom:1px solid var(--line); padding:6px 4px;
  }
  #responsesTable td{padding:8px 4px; border-bottom:1px dashed var(--line); vertical-align:top;}
  .chip{
    display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:11px;
    background:var(--bg); border:1px solid var(--line); border-radius:5px;
    padding:1px 6px; margin:2px 4px 2px 0;
  }
  .card-head-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;}
  .row-actions{display:flex; gap:6px; justify-content:flex-end;}
  .filter-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
  .filter-row input[type=text], .filter-row input[type=date]{
    font-family:'Pretendard'; font-size:13px; padding:8px 10px;
    border:1px solid var(--line); border-radius:7px; background:var(--bg); color:var(--ink);
  }
  .filter-row input[type=text]{min-width:180px;}
  .filter-row select{
    font-family:'Pretendard'; font-size:13px; padding:8px 10px;
    border:1px solid var(--line); border-radius:7px; background:var(--bg); color:var(--ink);
  }
  .cell-input, .cell-select{
    font-family:'Pretendard'; font-size:12px; padding:5px 6px;
    border:1px solid var(--line); border-radius:5px; background:var(--bg); color:var(--ink);
    width:100%; min-width:80px;
  }
  .note-input{
    font-family:'Pretendard'; font-size:12px; padding:5px 6px;
    border:1px solid var(--line); border-radius:5px; background:var(--bg); color:var(--ink);
    width:100%; min-width:110px;
  }
  .note-input:focus, .cell-input:focus, .cell-select:focus{outline:2px solid var(--green-soft); outline-offset:1px;}

  #configNotice{
    max-width:1600px; margin:20px auto 0; padding:14px 18px;
    background:var(--red-tint); border:1px solid #E9C4B0; border-radius:var(--radius);
    font-size:13px; line-height:1.6; display:none;
  }
  #configNotice code{background:#fff; padding:1px 5px; border-radius:4px;}
</style>
</head>
<body>

<div id="configNotice"></div>

<header>
  <p class="eyebrow">백데이터 · 참여자 관리</p>
  <h1 id="titleText">학교 방문 개별 상담 관리 <button class="title-edit-btn" id="editTitleBtn">이름 수정</button></h1>
  <p class="sub">참여 신청 현황을 확인하고 관리합니다.</p>
</header>

<main>
  <section class="card">
    <div class="card-head-row">
      <h2 style="margin:0;"><span class="tag">1</span> 참여 신청 현황</h2>
      <div style="display:flex; gap:8px;">
        <label class="btn ghost small" for="importFileInput" style="cursor:pointer; margin:0;">
          엑셀 불러오기
          <input type="file" id="importFileInput" accept=".xlsx,.xls" style="display:none;">
        </label>
        <button class="btn ghost small" id="exportBtn">CSV 내보내기</button>
      </div>
    </div>
    <p class="hint" id="importStatus" style="display:none; margin-bottom:12px;"></p>
    <div class="filter-row">
      <input type="text" id="searchNameInput" placeholder="학생 이름으로 검색">
      <input type="text" id="searchSchoolNameInput" placeholder="학교 이름으로 검색">
      <input type="text" id="searchSchoolLocationInput" placeholder="학교 소재지로 검색">
      <input type="date" id="searchDateInput" title="상담 날짜로 검색">
      <select id="sortModeSelect">
        <option value="recent">최근 등록순</option>
        <option value="name">학생 이름순</option>
        <option value="datetime">상담 일시순</option>
      </select>
      <button class="btn ghost small" id="clearFilterBtn">초기화</button>
    </div>
    <div id="responseList"><p class="empty">아직 접수된 신청이 없습니다.</p></div>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, doc, updateDoc, deleteDoc,
  onSnapshot, serverTimestamp, setDoc, getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ------------------------------------------------------------------
// 아래 firebaseConfig 값을 본인의 Firebase 프로젝트 값으로 교체하세요.
// Firebase 콘솔 > 프로젝트 설정 > 일반 > 내 앱 에서 확인할 수 있습니다.
// survey.html 에도 "동일한" 값을 넣어야 두 페이지가 같은 데이터를 공유합니다.
// Firestore 규칙은 (테스트용으로) 읽기/쓰기를 모두 허용하도록 설정해야 합니다.
// ------------------------------------------------------------------
const firebaseConfig = {
  apiKey: "AIzaSyCN5n1YDtZSmTB5en3P3FXY_jAMBB-h_YA",
  authDomain: "okya-admin.firebaseapp.com",
  projectId: "okya-admin",
  storageBucket: "okya-admin.firebasestorage.app",
  messagingSenderId: "226340731611",
  appId: "1:226340731611:web:f9621ec1462bd9d6e02afe"
};

const isConfigured = !firebaseConfig.apiKey.includes("YOUR_");
if(!isConfigured){
  const n = document.getElementById('configNotice');
  n.style.display = 'block';
  n.innerHTML = `<strong>설정이 필요합니다.</strong> 이 파일 하단의 <code>firebaseConfig</code> 값을 본인의 Firebase 프로젝트 정보로 바꿔주세요. (survey.html 도 동일하게 맞춰야 합니다)`;
}

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let responses = [];
let editingId = null;
let filterName = '';
let filterSchoolName = '';
let filterSchoolLocation = '';
let filterDate = '';
let sortMode = 'recent';

const GENDER_OPTIONS = ['남학생','여학생'];
const GRADE_OPTIONS = ['1학년','2학년','3학년','기타'];
const VISITOR_OPTIONS = ['1명','2명','3명','4명','5명 이상'];
const METHOD_OPTIONS = ['대면상담(학교방문)','전화상담'];
const TIME_OPTIONS = ['오전 10시~11시','오전 11시~12시','오후 1시~2시','오후 2시~3시','오후 3시~4시','오후 4시~5시','시간협의필요'];
const TIME_ORDER = Object.fromEntries(TIME_OPTIONS.map((t,i) => [t,i]));

// ---------- 행사명 ----------
const titleText = document.getElementById('titleText');
const editTitleBtn = document.getElementById('editTitleBtn');
const metaRef = doc(db, 'config', 'meta');

onSnapshot(metaRef, snap => {
  const name = snap.exists() && snap.data().eventName ? snap.data().eventName : '학교 방문 개별 상담 관리';
  titleText.childNodes[0].nodeValue = name + ' ';
});

editTitleBtn.addEventListener('click', async () => {
  const current = titleText.childNodes[0].nodeValue.trim();
  const next = prompt('행사 이름을 입력하세요', current);
  if(next && next.trim()){
    await setDoc(metaRef, { eventName: next.trim() }, { merge:true });
  }
});

// ---------- 실시간 구독 ----------
onSnapshot(collection(db, 'responses'), snap => {
  responses = snap.docs.map(d => ({ id:d.id, ...d.data() }));
  renderResponses();
});

function selectHtml(field, current, opts){
  return `<select class="cell-select" data-field="${field}">` +
    opts.map(o => `<option value="${o}" ${o===current?'selected':''}>${o}</option>`).join('') +
  `</select>`;
}

function rowHtml(r){
  if(r.id === editingId){
    return `
      <tr data-editrow="${r.id}">
        <td><input class="cell-input" data-field="studentName" value="${escapeHtml(r.studentName||'')}"></td>
        <td>${selectHtml('gender', r.gender||'', GENDER_OPTIONS)}</td>
        <td>${selectHtml('grade', r.grade||'', GRADE_OPTIONS)}</td>
        <td><input class="cell-input" data-field="schoolName" value="${escapeHtml(r.schoolName||'')}"></td>
        <td><input class="cell-input" data-field="schoolLocation" value="${escapeHtml(r.schoolLocation||'')}"></td>
        <td><input class="cell-input" data-field="parentPhone" value="${escapeHtml(r.parentPhone||'')}"></td>
        <td>${selectHtml('visitorCount', r.visitorCount||'', VISITOR_OPTIONS)}</td>
        <td>${selectHtml('consultMethod', r.consultMethod||'', METHOD_OPTIONS)}</td>
        <td><input class="cell-input" type="date" data-field="date" value="${escapeHtml(r.date||'')}"></td>
        <td>${selectHtml('time', r.time||'', TIME_OPTIONS)}</td>
        <td><button class="btn ${r.confirmed ? '' : 'ghost'} small" data-confirm="${r.id}" data-val="${r.confirmed}">${r.confirmed ? '확정' : '미확정'}</button></td>
        <td><button class="btn ${r.duplicateAllowed ? '' : 'ghost'} small" data-dup="${r.id}" data-val="${r.duplicateAllowed}">${r.duplicateAllowed ? '허용' : '제한'}</button></td>
        <td><input class="note-input" data-field="note" value="${escapeHtml(r.note||'')}" placeholder="메모"></td>
        <td>
          <div class="row-actions">
            <button class="btn small" data-save="${r.id}">저장</button>
            <button class="btn ghost small" data-cancel="${r.id}">취소</button>
          </div>
        </td>
      </tr>
    `;
  }
  return `
    <tr>
      <td>${escapeHtml(r.studentName ?? r.name ?? '')}</td>
      <td>${escapeHtml(r.gender || '')}</td>
      <td>${escapeHtml(r.grade || '')}</td>
      <td>${escapeHtml(r.schoolName || '')}</td>
      <td>${escapeHtml(r.schoolLocation || '')}</td>
      <td>${escapeHtml(r.parentPhone || '')}</td>
      <td>${escapeHtml(r.visitorCount || '')}</td>
      <td>${escapeHtml(r.consultMethod || '')}</td>
      <td>${formatDate(r.date)}</td>
      <td>${r.time ? `<span class="chip">${escapeHtml(r.time)}</span>` : (r.times||[]).map(t => `<span class="chip">${escapeHtml(t)}</span>`).join('')}</td>
      <td><button class="btn ${r.confirmed ? '' : 'ghost'} small" data-confirm="${r.id}" data-val="${r.confirmed}">${r.confirmed ? '확정' : '미확정'}</button></td>
      <td><button class="btn ${r.duplicateAllowed ? '' : 'ghost'} small" data-dup="${r.id}" data-val="${r.duplicateAllowed}">${r.duplicateAllowed ? '허용' : '제한'}</button></td>
      <td><input type="text" class="note-input" data-note="${r.id}" value="${escapeHtml(r.note || '')}" placeholder="메모"></td>
      <td>
        <div class="row-actions">
          <button class="btn ghost small" data-edit="${r.id}">수정</button>
          <button class="btn danger small" data-delres="${r.id}">삭제</button>
        </div>
      </td>
    </tr>
  `;
}

function renderResponses(){
  const wrap = document.getElementById('responseList');

  const filtered = responses.filter(r => {
    if(filterName && !String(r.studentName||'').includes(filterName)) return false;
    if(filterSchoolName && !String(r.schoolName||'').includes(filterSchoolName)) return false;
    if(filterSchoolLocation && !String(r.schoolLocation||'').includes(filterSchoolLocation)) return false;
    if(filterDate && r.date !== filterDate) return false;
    return true;
  });

  if(filtered.length === 0){
    wrap.innerHTML = responses.length === 0
      ? '<p class="empty">아직 접수된 신청이 없습니다.</p>'
      : '<p class="empty">조건에 맞는 신청이 없습니다.</p>';
    return;
  }

  let sorted;
  if(sortMode === 'name'){
    sorted = [...filtered].sort((a,b) => String(a.studentName||'').localeCompare(String(b.studentName||''), 'ko'));
  } else if(sortMode === 'datetime'){
    sorted = [...filtered].sort((a,b) => {
      const dcmp = String(a.date||'').localeCompare(String(b.date||''));
      if(dcmp !== 0) return dcmp;
      return (TIME_ORDER[a.time] ?? 99) - (TIME_ORDER[b.time] ?? 99);
    });
  } else {
    sorted = [...filtered].sort((a,b) => {
      const ta = a.createdAt?.toMillis ? a.createdAt.toMillis() : 0;
      const tb = b.createdAt?.toMillis ? b.createdAt.toMillis() : 0;
      return tb - ta;
    });
  }

  wrap.innerHTML = `
    <div class="table-scroll">
    <table id="responsesTable">
      <thead><tr>
        <th>학생 성명</th><th>성별</th><th>학년</th><th>학교 이름</th><th>학교 소재지</th>
        <th>학부모 연락처</th><th>방문인원</th><th>상담방법</th><th>희망 날짜</th><th>희망 시간</th>
        <th>확정 여부</th><th>중복 허용</th><th>비고</th><th></th>
      </tr></thead>
      <tbody>
        ${sorted.map(rowHtml).join('')}
      </tbody>
    </table>
    </div>
  `;
  wrap.querySelectorAll('[data-delres]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if(confirm('이 신청 기록을 삭제할까요?')){
        await deleteDoc(doc(db, 'responses', btn.getAttribute('data-delres')));
      }
    });
  });
  wrap.querySelectorAll('[data-confirm]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const cur = btn.getAttribute('data-val') === 'true';
      await updateDoc(doc(db, 'responses', btn.getAttribute('data-confirm')), { confirmed: !cur });
    });
  });
  wrap.querySelectorAll('[data-dup]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const cur = btn.getAttribute('data-val') === 'true';
      await updateDoc(doc(db, 'responses', btn.getAttribute('data-dup')), { duplicateAllowed: !cur });
    });
  });
  wrap.querySelectorAll('[data-note]').forEach(inp => {
    inp.addEventListener('blur', async () => {
      const id = inp.getAttribute('data-note');
      const val = inp.value.trim();
      const current = responses.find(r => r.id === id);
      if(current && (current.note||'') === val) return;
      await updateDoc(doc(db, 'responses', id), { note: val });
    });
  });
  wrap.querySelectorAll('[data-edit]').forEach(btn => {
    btn.addEventListener('click', () => {
      editingId = btn.getAttribute('data-edit');
      renderResponses();
    });
  });
  wrap.querySelectorAll('[data-cancel]').forEach(btn => {
    btn.addEventListener('click', () => {
      editingId = null;
      renderResponses();
    });
  });
  wrap.querySelectorAll('[data-save]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-save');
      const row = wrap.querySelector(`tr[data-editrow="${id}"]`);
      const fields = {};
      row.querySelectorAll('[data-field]').forEach(el => {
        fields[el.getAttribute('data-field')] = el.value.trim();
      });
      await updateDoc(doc(db, 'responses', id), fields);
      editingId = null;
      renderResponses();
    });
  });
}

document.getElementById('searchNameInput').addEventListener('input', (e) => {
  filterName = e.target.value.trim();
  renderResponses();
});
document.getElementById('searchSchoolNameInput').addEventListener('input', (e) => {
  filterSchoolName = e.target.value.trim();
  renderResponses();
});
document.getElementById('searchSchoolLocationInput').addEventListener('input', (e) => {
  filterSchoolLocation = e.target.value.trim();
  renderResponses();
});
document.getElementById('searchDateInput').addEventListener('input', (e) => {
  filterDate = e.target.value;
  renderResponses();
});
document.getElementById('sortModeSelect').addEventListener('change', (e) => {
  sortMode = e.target.value;
  renderResponses();
});
document.getElementById('clearFilterBtn').addEventListener('click', () => {
  filterName = '';
  filterSchoolName = '';
  filterSchoolLocation = '';
  filterDate = '';
  sortMode = 'recent';
  document.getElementById('searchNameInput').value = '';
  document.getElementById('searchSchoolNameInput').value = '';
  document.getElementById('searchSchoolLocationInput').value = '';
  document.getElementById('searchDateInput').value = '';
  document.getElementById('sortModeSelect').value = 'recent';
  renderResponses();
});

document.getElementById('exportBtn').addEventListener('click', () => {
  if(responses.length === 0){ alert('내보낼 신청 기록이 없습니다.'); return; }
  const header = [
    '학생 성명','성별','학년','학교 이름','학교 소재지','학부모 연락처','방문인원','상담방법',
    '희망 날짜','희망 시간','상담 확정 여부','동일 시간 중복 허용 여부','비고'
  ];
  const rows = responses.map(r => [
    r.studentName ?? r.name ?? '',
    r.gender || '',
    r.grade || '',
    r.schoolName || '',
    r.schoolLocation || '',
    r.parentPhone || '',
    r.visitorCount || '',
    r.consultMethod || '',
    r.date || '',
    r.time || (r.times||[]).join(' / '),
    r.confirmed ? '확정' : '미확정',
    r.duplicateAllowed ? '허용' : '',
    r.note || ''
  ]);
  const csv = [header, ...rows].map(row =>
    row.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')
  ).join('\n');
  const blob = new Blob(["\uFEFF" + csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '개별상담신청현황.csv';
  a.click();
  URL.revokeObjectURL(url);
});

function formatDate(dateStr){
  if(!dateStr) return '';
  const [y,m,d] = dateStr.split('-');
  return `${parseInt(m)}월 ${parseInt(d)}일`;
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ------------------------------------------------------------------
// 엑셀 불러오기 ("신입학상담신청" 시트 기준 — 컬럼명이 다르면 못 읽어옵니다)
// ------------------------------------------------------------------
function pad2(n){ return String(n).padStart(2,'0'); }

function parseExcelDate(v){
  if(v instanceof Date && !isNaN(v)){
    return `${v.getFullYear()}-${pad2(v.getMonth()+1)}-${pad2(v.getDate())}`;
  }
  const s = String(v ?? '').trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(m){
    let mo = parseInt(m[1]), d = parseInt(m[2]), y = parseInt(m[3]);
    if(y < 100) y += 2000;
    return `${y}-${pad2(mo)}-${pad2(d)}`;
  }
  return null;
}

function normalizeTime(raw){
  const s = String(raw ?? '').trim();
  if(s.replace(/\s/g,'') === '시간협의필요') return '시간협의필요';
  const m = s.match(/(오전|오후)\s*(\d{1,2}):00\s*~\s*(\d{1,2}):00/);
  if(m) return `${m[1]} ${parseInt(m[2])}시~${parseInt(m[3])}시`;
  return null;
}

function normalizeMethod(raw){
  const s = String(raw ?? '').replace(/\s/g,'');
  if(s.includes('대면')) return '대면상담(학교방문)';
  if(s.includes('전화')) return '전화상담';
  return '';
}

function normalizeGrade(raw){
  const s = String(raw ?? '');
  if(s.includes('1학년')) return '1학년';
  if(s.includes('2학년')) return '2학년';
  if(s.includes('3학년')) return '3학년';
  return s.trim() ? '기타' : '';
}

function normalizeGender(raw){
  const s = String(raw ?? '').trim();
  if(s === '여') return '여학생';
  if(s === '남') return '남학생';
  return '';
}

document.getElementById('importFileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('importStatus');
  statusEl.style.display = 'block';
  statusEl.textContent = '엑셀 파일을 읽는 중...';

  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array', cellDates:true });
    const sheetName = wb.SheetNames.find(n => n.includes('상담신청')) || wb.SheetNames[0];
    const sheet = wb.Sheets[sheetName];
    const sheetRows = XLSX.utils.sheet_to_json(sheet, { defval:'' });

    const targetRows = sheetRows.filter(row => String(row['학생 성명'] || '').trim());
    if(targetRows.length === 0){
      statusEl.textContent = `"${sheetName}" 시트에서 학생 성명이 있는 행을 찾지 못했습니다. 컬럼명을 확인해주세요.`;
      e.target.value = '';
      return;
    }
    if(!confirm(`"${sheetName}" 시트에서 ${targetRows.length}건을 찾았습니다. 불러올까요? (이미 등록된 것과 이름·날짜·시간이 같은 건은 건너뜁니다)`)){
      e.target.value = '';
      return;
    }

    let success = 0, duplicate = 0, needsReview = [];

    for(const row of targetRows){
      const studentName = String(row['학생 성명']).trim();
      const dateStr = parseExcelDate(row['희망 날짜']);
      const time = normalizeTime(row['희망 시간']);

      if(!dateStr || !time){
        needsReview.push(`${studentName} (${!dateStr ? '날짜' : ''}${!dateStr && !time ? '·' : ''}${!time ? '시간' : ''} 형식 확인 필요)`);
        continue;
      }

      const isDuplicate = responses.some(r =>
        r.studentName === studentName && r.date === dateStr && r.time === time
      );
      if(isDuplicate){ duplicate++; continue; }

      const payload = {
        studentName,
        gender: normalizeGender(row['성별']),
        grade: normalizeGrade(row['학년']),
        schoolName: String(row['학교 이름'] || '').trim(),
        schoolLocation: String(row['학교 소재지'] || '').trim(),
        parentPhone: String(row['학부모 연락처'] || '').trim(),
        visitorCount: String(row['방문인원수'] || '').trim(),
        consultMethod: normalizeMethod(row['상담 방법']),
        date: dateStr,
        time,
        privacyConsent: String(row['개인정보 수집 및 이용에 동의'] || '').trim(),
        confirmed: String(row['상담 확정 여부'] || '').includes('확정'),
        duplicateAllowed: String(row['동일 시간 중복 허용 여부'] || '').includes('허용'),
        createdAt: serverTimestamp()
      };

      try{
        await addDoc(collection(db, 'responses'), payload);
        responses.push(payload); // 같은 파일 안에서의 중복도 바로 걸러지도록
        success++;
      }catch(err){
        needsReview.push(`${studentName} (저장 실패)`);
      }
    }

    let msg = `${success}건 가져오기 완료`;
    if(duplicate > 0) msg += ` · ${duplicate}건은 이미 등록되어 건너뜀`;
    if(needsReview.length > 0) msg += ` · 확인 필요 ${needsReview.length}건: ${needsReview.join(', ')}`;
    statusEl.textContent = msg;
  }catch(err){
    statusEl.textContent = '엑셀 파일을 읽는 중 오류가 발생했습니다: ' + err.message;
  }
  e.target.value = '';
});
</script>
