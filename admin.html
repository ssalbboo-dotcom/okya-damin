<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학교 방문 개별 상담 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#FAFAF7;
    --paper:#FFFFFF;
    --ink:#22262B;
    --ink-soft:#5B584F;
    --line:#DAD6CB;
    --green:#2F5233;
    --green-soft:#3F7B4F;
    --green-tint:#EAF1EA;
    --red:#C1440E;
    --red-tint:#FBEAE3;
    --muted:#9C9890;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(47,82,51,0.045) 28px),
      var(--bg);
    color:var(--ink);
    font-family:'Pretendard', -apple-system, sans-serif;
    padding-bottom:80px;
  }
  header{
    padding:32px 20px 20px;
    max-width:1600px;
    margin:0 auto;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--green-soft);
    margin:0 0 6px;
  }
  h1{
    font-family:'Gowun Batang', serif;
    font-size:28px;
    margin:0 0 4px;
    line-height:1.3;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .title-edit-btn{
    font-family:'Pretendard';
    font-size:12px;
    color:var(--ink-soft);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:20px;
    padding:4px 10px;
    cursor:pointer;
  }
  .title-edit-btn:hover{border-color:var(--green-soft); color:var(--green-soft);}
  .sub{color:var(--ink-soft); font-size:14px; margin:0;}
  .hint{font-size:13px; color:var(--ink-soft); line-height:1.6;}
  main{max-width:1600px; margin:0 auto; padding:0 20px;}
  section.card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
    margin-top:20px;
  }
  h2{
    font-size:15px;
    margin:0 0 16px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:8px;
  }
  h2 .tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--paper);
    background:var(--green);
    padding:2px 7px;
    border-radius:5px;
  }
  .btn{
    font-family:'Pretendard';
    font-weight:600;
    font-size:14px;
    padding:9px 16px;
    border-radius:7px;
    border:1px solid var(--green);
    background:var(--green);
    color:#fff;
    cursor:pointer;
  }
  .btn:hover{background:var(--green-soft); border-color:var(--green-soft);}
  .btn.ghost{
    background:transparent; color:var(--ink-soft); border:1px solid var(--line);
    font-weight:500;
  }
  .btn.ghost:hover{border-color:var(--ink-soft); color:var(--ink);}
  .btn.danger{background:transparent; color:var(--red); border:1px solid var(--red-tint);}
  .btn.danger:hover{background:var(--red-tint);}
  .btn.small{padding:5px 10px; font-size:12px;}
  .btn-highlight{background:var(--red); border-color:var(--red); color:#fff;}
  .btn-highlight:hover{background:#a3390d; border-color:#a3390d;}
  .empty{color:var(--muted); font-size:14px; padding:10px 0;}

  .table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .data-table{width:100%; border-collapse:collapse; font-size:13px;}
  #responsesTable{min-width:1180px;}
  #logTable{min-width:900px;}
  .data-table th{
    text-align:left; font-family:'IBM Plex Mono', monospace; font-weight:600;
    font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em;
    background:#EFEBE0; border:1px solid var(--line); padding:7px 6px;
  }
  .data-table td{padding:8px 6px; border-bottom:1px dashed var(--line); border-right:1px solid var(--line); vertical-align:top;}
  .data-table td:last-child{border-right:none;}
  .data-table tbody tr:nth-child(even){background:#F1EFE8;}

  .name-link{font-weight:700; color:var(--green); cursor:pointer; text-underline-offset:3px;}
  .name-link:hover{color:var(--green-soft); text-decoration:underline;}
  .log-count-badge{
    display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:10px; font-weight:700;
    background:var(--green); color:#fff; border-radius:9px; padding:1px 7px; margin-left:2px;
  }
  .log-count-badge.zero{background:#C3C9D1;}

  /* 상담 기록 모달 */
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(34,38,43,0.55);
    z-index:100; align-items:flex-start; justify-content:center; padding:32px 16px; overflow-y:auto;
  }
  .modal-overlay.show{display:flex;}
  .card-modal{
    background:var(--paper); border-radius:14px; width:100%; max-width:560px;
    box-shadow:0 20px 60px rgba(20,20,15,0.3); display:flex; flex-direction:column;
    max-height:calc(100vh - 64px);
  }
  .card-header{
    background:var(--green); color:#fff; padding:18px 22px; border-radius:14px 14px 0 0;
    display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
  }
  .card-header h3{font-family:'Gowun Batang', serif; font-size:19px; margin:0; font-weight:400;}
  .card-sub{font-size:12px; color:#E4EDE4; margin:6px 0 0;}
  .card-close{
    background:rgba(255,255,255,0.15); border:none; color:#fff; width:28px; height:28px;
    border-radius:8px; font-size:14px; cursor:pointer; flex-shrink:0;
  }
  .card-close:hover{background:rgba(255,255,255,0.28);}
  .card-body{padding:18px 22px; overflow-y:auto;}
  .section-title{
    font-size:13px; font-weight:700; color:var(--ink); margin:0 0 10px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .section-title .log-count{font-size:12px; font-weight:600; color:var(--ink-soft);}
  .log-list{display:flex; flex-direction:column; gap:10px; margin-bottom:14px;}
  .log-entry{border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:var(--paper);}
  .log-entry-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .log-seq{font-size:11px; font-weight:700; color:#fff; background:var(--green); padding:2px 8px; border-radius:10px;}
  .log-entry-actions{display:flex; gap:4px;}
  .log-entry-actions button{background:none; border:none; padding:2px 6px; font-size:12px; color:var(--ink-soft); border-radius:5px; cursor:pointer;}
  .log-entry-actions button:hover{background:#EEECE6; color:var(--green);}
  .log-content{font-size:13px; color:var(--ink); white-space:pre-wrap; line-height:1.6;}
  .log-content-edit{
    width:100%; font-family:'Pretendard'; font-size:13px; border:1px solid var(--green-soft);
    border-radius:8px; padding:7px 9px; resize:vertical; min-height:60px;
  }
  .log-empty{font-size:12.5px; color:var(--muted); text-align:center; padding:14px 0;}
  .log-add-form{border-top:1px solid var(--line); padding-top:14px; display:flex; flex-direction:column; gap:8px;}
  .log-add-form .row{display:flex; gap:8px; align-items:center;}
  .log-add-form input[type=date]{
    border:1px solid var(--line); border-radius:8px; padding:7px 9px; font-family:'IBM Plex Mono', monospace; font-size:13px;
  }
  .log-add-form textarea{
    width:100%; min-height:70px; font-family:'Pretendard'; font-size:13px; padding:8px;
    border:1px solid var(--line); border-radius:8px; resize:vertical;
  }
  .log-add-form .next-seq{font-size:12px; color:var(--ink-soft); font-weight:600;}

  .log-list{display:flex; flex-direction:column; gap:10px;}
  .log-date{font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-soft); min-width:76px;}
  .log-expand-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:10px; margin-bottom:12px;}
  .log-field label{display:block; font-size:11px; color:var(--ink-soft); margin-bottom:4px;}
  .log-field select, .log-field .cell-input{width:100%;}
  .chip{
    display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:11px;
    background:var(--bg); border:1px solid var(--line); border-radius:5px;
    padding:1px 6px; margin:2px 4px 2px 0;
  }
  .badge{font-size:11px; padding:2px 8px; border-radius:20px; font-weight:600;}
  .badge.open{background:var(--green-tint); color:var(--green);}
  .badge.closed{background:#EEECE6; color:var(--muted);}
  .card-head-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;}
  .row-actions{display:flex; gap:6px; justify-content:flex-end;}
  .filter-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
  .filter-row input[type=text], .filter-row input[type=date]{
    font-family:'Pretendard'; font-size:13px; padding:8px 10px;
    border:1px solid var(--line); border-radius:7px; background:var(--bg); color:var(--ink);
  }
  .filter-row input[type=text]{min-width:180px;}
  .date-range{display:flex; align-items:center; gap:6px; color:var(--ink-soft); font-size:13px;}
  .filter-row select{
    font-family:'Pretendard'; font-size:13px; padding:8px 10px;
    border:1px solid var(--line); border-radius:7px; background:var(--bg); color:var(--ink);
  }
  .cell-input, .cell-select{
    font-family:'Pretendard'; font-size:12px; padding:5px 6px;
    border:1px solid var(--line); border-radius:5px; background:var(--bg); color:var(--ink);
    width:100%; min-width:80px;
  }
  .note-input{
    font-family:'Pretendard'; font-size:12px; padding:5px 6px;
    border:1px solid var(--line); border-radius:5px; background:var(--bg); color:var(--ink);
    width:100%; min-width:110px;
  }
  .note-input:focus, .cell-input:focus, .cell-select:focus{outline:2px solid var(--green-soft); outline-offset:1px;}

  .view-tabs{display:flex; gap:6px; margin-bottom:18px; border-bottom:1px solid var(--line);}
  .view-tab{
    font-family:'Pretendard'; font-weight:600; font-size:13px;
    padding:9px 4px; margin-bottom:-1px;
    background:none; border:none; border-bottom:2px solid transparent;
    color:var(--ink-soft); cursor:pointer;
  }
  .view-tab.active{color:var(--green); border-bottom-color:var(--green);}
  .view-tab:hover{color:var(--green-soft);}

  .cal-nav{display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:14px;}
  .cal-month-label{font-family:'Gowun Batang', serif; font-size:18px; min-width:110px; text-align:center;}
  .cal-weekdays{
    display:grid; grid-template-columns:repeat(7,1fr);
    font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft);
    text-align:center; padding:0 0 6px;
  }
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:8px; overflow:hidden;}
  .cal-cell{background:var(--paper); min-height:96px; padding:6px; display:flex; flex-direction:column; gap:3px; cursor:pointer;}
  .cal-cell:hover{background:var(--green-tint);}
  .cal-cell.empty{background:var(--bg); cursor:default;}
  .cal-cell.empty:hover{background:var(--bg);}
  .cal-cell.selected{outline:2px solid var(--green); outline-offset:-2px; background:var(--green-tint);}
  .cal-cell.today .cal-daynum{color:#fff; background:var(--green); border-radius:50%; width:20px; height:20px; display:flex; align-items:center; justify-content:center;}
  .cal-daynum{font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-soft); font-weight:600;}
  .cal-entry{
    font-size:11px; background:var(--green-tint); color:var(--green); border-radius:4px;
    padding:2px 5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .cal-cell.selected .cal-entry{background:#fff;}
  .cal-more{font-size:10px; color:var(--muted);}

  .cal-day-detail{margin-top:18px; padding-top:18px; border-top:1px dashed var(--line);}
  .cal-detail-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
  .cal-detail-head h3{font-family:'Gowun Batang', serif; font-size:17px; margin:0; font-weight:400;}
  .cal-detail-row{
    display:flex; flex-wrap:wrap; align-items:center; gap:10px;
    padding:12px 6px; border-bottom:1px dashed var(--line); font-size:13px;
  }
  .cal-detail-row:last-child{border-bottom:none;}
  .cal-detail-main{flex:1; min-width:220px;}
  .cal-detail-name{font-weight:600;}
  .cal-detail-sub{color:var(--ink-soft); font-size:12px; margin-top:2px;}

  #configNotice{
    max-width:1600px; margin:20px auto 0; padding:14px 18px;
    background:var(--red-tint); border:1px solid #E9C4B0; border-radius:var(--radius);
    font-size:13px; line-height:1.6; display:none;
  }
  #configNotice code{background:#fff; padding:1px 5px; border-radius:4px;}
</style>
</head>
<body>

<div id="configNotice"></div>

<header>
  <p class="eyebrow">백데이터 · 참여자 관리</p>
  <h1 id="titleText">학교 방문 개별 상담 관리 <button class="title-edit-btn" id="editTitleBtn">이름 수정</button></h1>
  <p class="sub">참여 신청 현황을 확인하고 관리합니다.</p>
</header>

<main>
  <section class="card">
    <div class="card-head-row">
      <h2 style="margin:0;"><span class="tag">1</span> 상담 데이터 관리</h2>
    </div>

    <div class="view-tabs">
      <button class="view-tab active" data-view="list">상담신청목록</button>
      <button class="view-tab" data-view="calendar">캘린더 보기</button>
      <button class="view-tab" data-view="log">상담일지관리</button>
    </div>

    <div id="listView">
      <div class="card-head-row">
        <span class="hint" style="margin:0;">개별 상담 신청 현황</span>
        <div style="display:flex; gap:8px;">
          <label class="btn ghost small" for="importFileInput" style="cursor:pointer; margin:0;">
            엑셀 불러오기
            <input type="file" id="importFileInput" accept=".xlsx,.xls" style="display:none;">
          </label>
          <button class="btn ghost small" id="exportBtn">CSV 내보내기</button>
        </div>
      </div>
      <p class="hint" id="importStatus" style="display:none; margin-bottom:12px;"></p>
      <div class="filter-row">
        <input type="text" id="searchNameInput" placeholder="학생 이름으로 검색">
        <input type="text" id="searchSchoolNameInput" placeholder="학교 이름으로 검색">
        <input type="text" id="searchSchoolLocationInput" placeholder="학교 소재지로 검색">
        <div class="date-range">
          <input type="date" id="searchDateStartInput" title="상담 날짜 시작">
          <span>~</span>
          <input type="date" id="searchDateEndInput" title="상담 날짜 끝">
        </div>
        <select id="sortModeSelect">
          <option value="recent">최근 등록순</option>
          <option value="name">학생 이름순</option>
          <option value="datetime">상담 일시순</option>
        </select>
        <button class="btn ghost small" id="sortDirBtn" title="정렬 순서 뒤집기">↓ 정순</button>
        <button class="btn ghost small" id="clearFilterBtn">초기화</button>
      </div>
      <div id="responseList"><p class="empty">아직 접수된 신청이 없습니다.</p></div>
    </div>

    <div id="calendarView" style="display:none;">
      <div class="cal-nav">
        <button class="btn ghost small" id="calPrevBtn">‹ 이전 달</button>
        <span id="calMonthLabel" class="cal-month-label"></span>
        <button class="btn ghost small" id="calNextBtn">다음 달 ›</button>
      </div>
      <div class="cal-weekdays">
        <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
      </div>
      <div id="calGrid" class="cal-grid"></div>
      <div id="calDayDetail" class="cal-day-detail" style="display:none;">
        <div class="cal-detail-head">
          <h3 id="calDetailTitle"></h3>
          <button class="btn ghost small" id="calDetailToListBtn">목록에서 보기</button>
        </div>
        <div id="calDetailList"></div>
      </div>
    </div>

    <div id="logView" style="display:none;">
      <div class="card-head-row">
        <span class="hint" style="margin:0;">상담일지 (방문·전화 상담 기록)</span>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-highlight" id="logAddNewBtn" style="margin:0;">+ 상담기록추가</button>
          <label class="btn ghost small" for="logImportFileInput" style="cursor:pointer; margin:0;">
            엑셀 불러오기
            <input type="file" id="logImportFileInput" accept=".xlsx,.xls" style="display:none;">
          </label>
          <button class="btn ghost small" id="logExportBtn">CSV 내보내기</button>
        </div>
      </div>
      <p class="hint" id="logImportStatus" style="display:none; margin-bottom:12px;"></p>
      <div class="filter-row">
        <input type="text" id="logSearchNameInput" placeholder="이름으로 검색">
        <input type="text" id="logSearchSchoolInput" placeholder="중학교로 검색">
        <input type="text" id="logSearchCounselorInput" placeholder="상담자로 검색">
        <div class="date-range">
          <input type="date" id="logSearchDateStartInput" title="상담 날짜 시작">
          <span>~</span>
          <input type="date" id="logSearchDateEndInput" title="상담 날짜 끝">
        </div>
        <select id="logSortModeSelect">
          <option value="recent">최근 등록순</option>
          <option value="name">이름순</option>
          <option value="date">상담 날짜순</option>
        </select>
        <button class="btn ghost small" id="logSortDirBtn" title="정렬 순서 뒤집기">↓ 정순</button>
        <button class="btn ghost small" id="logClearFilterBtn">초기화</button>
      </div>
      <div id="logList"><p class="empty">아직 등록된 상담일지가 없습니다.</p></div>
    </div>
  </section>
</main>

<div class="modal-overlay" id="logModalOverlay">
  <div class="card-modal">
    <div class="card-header">
      <div>
        <h3 id="logCardName"></h3>
        <p id="logCardSub" class="card-sub"></p>
      </div>
      <button class="card-close" id="logCardClose">✕</button>
    </div>
    <div class="card-body">
      <div class="section-title">
        <span>누적 상담 기록</span>
        <span class="log-count" id="logCardCount">총 0회</span>
      </div>
      <div class="log-list" id="logCardList"></div>

      <div class="log-add-form">
        <div class="row">
          <span class="next-seq" id="logNextSeqLabel">1차 상담 등록</span>
        </div>
        <div class="log-expand-grid" id="logAddGrid"></div>
        <textarea id="logNewContent" placeholder="이번 상담 내용을 입력하세요"></textarea>
        <button class="btn" id="logAddBtn" style="align-self:flex-end;">+ 상담 기록 추가</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, doc, updateDoc, deleteDoc,
  onSnapshot, serverTimestamp, setDoc, getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ------------------------------------------------------------------
// 아래 firebaseConfig 값을 본인의 Firebase 프로젝트 값으로 교체하세요.
// Firebase 콘솔 > 프로젝트 설정 > 일반 > 내 앱 에서 확인할 수 있습니다.
// survey.html 에도 "동일한" 값을 넣어야 두 페이지가 같은 데이터를 공유합니다.
// Firestore 규칙은 (테스트용으로) 읽기/쓰기를 모두 허용하도록 설정해야 합니다.
// ------------------------------------------------------------------
const firebaseConfig = {
  apiKey: "AIzaSyCN5n1YDtZSmTB5en3P3FXY_jAMBB-h_YA",
  authDomain: "okya-admin.firebaseapp.com",
  projectId: "okya-admin",
  storageBucket: "okya-admin.firebasestorage.app",
  messagingSenderId: "226340731611",
  appId: "1:226340731611:web:f9621ec1462bd9d6e02afe"
};

const isConfigured = !firebaseConfig.apiKey.includes("YOUR_");
if(!isConfigured){
  const n = document.getElementById('configNotice');

function selectHtml(field, current, opts){
  return `<select class="cell-select" data-field="${field}">` +
    opts.map(o => `<option value="${o}" ${o===current?'selected':''}>${o}</option>`).join('') +
  `</select>`;
}

        <td><input class="cell-input" data-field="studentName" value="${escapeHtml(r.studentName||'')}"></td>

      <td>${escapeHtml(r.schoolName || '')}</td>
      <td>${escapeHtml(r.schoolLocation || '')}</td>
      <td>${escapeHtml(r.parentPhone || '')}</td>
      <td>${escapeHtml(r.visitorCount || '')}</td>
      <td>${escapeHtml(r.consultMethod || '')}</td>

function renderResponses(){
  const wrap = document.getElementById('responseList');

  const filtered = responses.filter(r => {
    if(filterName && !String(r.studentName||'').includes(filterName)) return false;
    if(filterSchoolName && !String(r.schoolName||'').includes(filterSchoolName)) return false;
    if(filterSchoolLocation && !String(r.schoolLocation||'').includes(filterSchoolLocation)) return false;
    if(filterDateStart && r.date < filterDateStart) return false;
    if(filterDateEnd && r.date > filterDateEnd) return false;
    return true;
  });

  if(filtered.length === 0){
    wrap.innerHTML = responses.length === 0
      ? '<p class="empty">아직 접수된 신청이 없습니다.</p>'
      : '<p class="empty">조건에 맞는 신청이 없습니다.</p>';
    return;
  }

  let sorted;
  if(sortMode === 'name'){
    sorted = [...filtered].sort((a,b) => String(a.studentName||'').localeCompare(String(b.studentName||''), 'ko'));
  } else if(sortMode === 'datetime'){
    sorted = [...filtered].sort((a,b) => {
      const dcmp = String(a.date||'').localeCompare(String(b.date||''));
      if(dcmp !== 0) return dcmp;
      return (TIME_ORDER[a.time] ?? 99) - (TIME_ORDER[b.time] ?? 99);
    });
  } else {
    sorted = [...filtered].sort((a,b) => {
      const ta = a.createdAt?.toMillis ? a.createdAt.toMillis() : 0;
      const tb = b.createdAt?.toMillis ? b.createdAt.toMillis() : 0;
      return tb - ta;
    });
  }
  if(sortReverse) sorted.reverse();

  wrap.innerHTML = `
    <div class="table-scroll">
    <table id="responsesTable" class="data-table">
      <thead><tr>
        <th>접수일자</th><th>학생 성명</th><th>성별</th><th>학년</th><th>학교 이름</th><th>학교 소재지</th>
        <th>학부모 연락처</th><th>방문인원</th><th>상담방법</th><th>상담희망날짜</th><th>상담희망시간</th>
        <th>확정 여부</th><th>중복 허용</th><th>비고</th><th></th>
      </tr></thead>
      <tbody>
        ${sorted.map(rowHtml).join('')}
      </tbody>
    </table>
    </div>
  `;
  wrap.querySelectorAll('[data-delres]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if(confirm('이 신청 기록을 삭제할까요?')){
        await deleteDoc(doc(db, 'responses', btn.getAttribute('data-delres')));
      }
    });
  });
  wrap.querySelectorAll('[data-confirm]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const cur = btn.getAttribute('data-val') === 'true';
      await updateDoc(doc(db, 'responses', btn.getAttribute('data-confirm')), { confirmed: !cur });
    });
  });
  wrap.querySelectorAll('[data-dup]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const cur = btn.getAttribute('data-val') === 'true';
      await updateDoc(doc(db, 'responses', btn.getAttribute('data-dup')), { duplicateAllowed: !cur });
    });
  });
  wrap.querySelectorAll('[data-note]').forEach(inp => {
    inp.addEventListener('blur', async () => {
      const id = inp.getAttribute('data-note');
      const val = inp.value.trim();
      const current = responses.find(r => r.id === id);
      if(current && (current.note||'') === val) return;
      await updateDoc(doc(db, 'responses', id), { note: val });
    });
  });
  wrap.querySelectorAll('[data-edit]').forEach(btn => {
    btn.addEventListener('click', () => {
      editingId = btn.getAttribute('data-edit');
      renderResponses();
    });
  });
  wrap.querySelectorAll('[data-cancel]').forEach(btn => {
    btn.addEventListener('click', () => {
      editingId = null;
      renderResponses();
    });
  });
  wrap.querySelectorAll('[data-save]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-save');
      const row = wrap.querySelector(`tr[data-editrow="${id}"]`);
      const fields = {};
      row.querySelectorAll('[data-field]').forEach(el => {
        fields[el.getAttribute('data-field')] = el.value.trim();
      });
      await updateDoc(doc(db, 'responses', id), fields);
      editingId = null;
      renderResponses();
    });
  });
  wrap.querySelectorAll('[data-tolog]').forEach(btn => {
    btn.addEventListener('click', () => sendToCounselingLog(btn.getAttribute('data-tolog')));
  });
}

// 신청 건 하나를 상담일지관리로 보내기 (없으면 1차 상담 기록 생성, 있으면 바로 열기)
function sendToCounselingLog(responseId){
  const r = responses.find(x => x.id === responseId);
  if(!r) return;
  const name = (r.studentName ?? r.name ?? '').trim();
  if(!name){ alert('학생 이름이 없어 상담일지로 보낼 수 없습니다.'); return; }

  const method = r.consultMethod || '';
  logAddSeed = {
    consultType: method.includes('전화') ? '전화' : (method.includes('대면') ? '방문' : ''),
    date: r.date || '',
    gender: (r.gender || '').replace('학생',''),
    grade: (r.grade || '').replace('학년',''),
    region: r.schoolLocation || '',
    middleSchool: r.schoolName || '',
    gradeRank: '',
    studentPhone: '',
    guardianPhone: r.parentPhone || '',
    admissionWill: '',
    visitor: ''
  };
  logAddSeedName = name;

  document.querySelector('.view-tab[data-view="log"]').click();
  openLogCard(name);
}

// 목록 보기 / 캘린더 보기 탭
// ------------------------------------------------------------------
const todayObj = new Date();
let calYear = todayObj.getFullYear();
let calMonth = todayObj.getMonth() + 1; // 1~12
let calSelectedDate = null;

document.querySelectorAll('.view-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.view-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const view = btn.getAttribute('data-view');
    document.getElementById('listView').style.display = view === 'list' ? '' : 'none';
    document.getElementById('calendarView').style.display = view === 'calendar' ? '' : 'none';
    document.getElementById('logView').style.display = view === 'log' ? '' : 'none';
    if(view === 'calendar') renderCalendar();
    if(view === 'log') renderLogs();
  });
});

document.getElementById('calPrevBtn').addEventListener('click', () => {
  calMonth--;
  if(calMonth < 1){ calMonth = 12; calYear--; }
  calSelectedDate = null;
  renderCalendar();
});
document.getElementById('calNextBtn').addEventListener('click', () => {
  calMonth++;
  if(calMonth > 12){ calMonth = 1; calYear++; }
  calSelectedDate = null;
  renderCalendar();
});

function renderCalendar(){
  document.getElementById('calMonthLabel').textContent = `${calYear}년 ${calMonth}월`;

  const firstDow = new Date(calYear, calMonth-1, 1).getDay(); // 0=일
  const daysInMonth = new Date(calYear, calMonth, 0).getDate();
  const todayStr = `${todayObj.getFullYear()}-${pad2(todayObj.getMonth()+1)}-${pad2(todayObj.getDate())}`;

  const byDate = {};
  responses.forEach(r => {
    if(!r.date) return;
    (byDate[r.date] ||= []).push(r);
  });

  let cells = '';
  for(let i=0; i<firstDow; i++){
    cells += `<div class="cal-cell empty"></div>`;
  }
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${calYear}-${pad2(calMonth)}-${pad2(d)}`;
    const entries = (byDate[dateStr] || []).sort((a,b) => (TIME_ORDER[a.time] ?? 99) - (TIME_ORDER[b.time] ?? 99));
    const isToday = dateStr === todayStr;
    const isSelected = dateStr === calSelectedDate;
    const shown = entries.slice(0, 3);
    const extra = entries.length - shown.length;
    cells += `
      <div class="cal-cell ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}" data-caldate="${dateStr}">
        <span class="cal-daynum">${d}</span>
        ${shown.map(r => `<span class="cal-entry">${escapeHtml(r.studentName||'')} · ${escapeHtml(r.time||'')}</span>`).join('')}
        ${extra > 0 ? `<span class="cal-more">+${extra}건 더</span>` : ''}
      </div>
    `;
  }
  document.getElementById('calGrid').innerHTML = cells;

  document.querySelectorAll('.cal-cell[data-caldate]').forEach(cell => {
    cell.addEventListener('click', () => {
      calSelectedDate = cell.getAttribute('data-caldate');
      renderCalendar();
      renderCalDayDetail(calSelectedDate);
    });
  });

  if(calSelectedDate){
    renderCalDayDetail(calSelectedDate);
  } else {
    document.getElementById('calDayDetail').style.display = 'none';
  }
}

function renderCalDayDetail(dateStr){
  const panel = document.getElementById('calDayDetail');
  const entries = responses
    .filter(r => r.date === dateStr)
    .sort((a,b) => (TIME_ORDER[a.time] ?? 99) - (TIME_ORDER[b.time] ?? 99));

  panel.style.display = 'block';
  document.getElementById('calDetailTitle').textContent = `${formatDate(dateStr)} 신청 내역 (${entries.length}건)`;

  const listEl = document.getElementById('calDetailList');
  if(entries.length === 0){
    listEl.innerHTML = '<p class="empty">이 날짜에는 신청이 없습니다.</p>';
    return;
  }
  listEl.innerHTML = entries.map(r => `
    <div class="cal-detail-row">
      <span class="chip">${escapeHtml(r.time || '')}</span>
      <div class="cal-detail-main">
        <div class="cal-detail-name">${escapeHtml(r.studentName || '')} <span style="font-weight:400; color:var(--ink-soft);">(${escapeHtml(r.grade||'')} · ${escapeHtml(r.gender||'')})</span></div>
        <div class="cal-detail-sub">${escapeHtml(r.schoolName||'')} ${r.schoolLocation ? '· '+escapeHtml(r.schoolLocation) : ''} · ${escapeHtml(r.parentPhone||'')} · ${escapeHtml(r.consultMethod||'')}</div>
        ${r.note ? `<div class="cal-detail-sub">비고: ${escapeHtml(r.note)}</div>` : ''}
      </div>
      <span class="badge ${r.confirmed ? 'open' : 'closed'}">${r.confirmed ? '확정' : '미확정'}</span>
      <button class="btn ghost small" data-caledit="${r.id}">수정</button>
    </div>
  `).join('');

  listEl.querySelectorAll('[data-caledit]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-caledit');
      document.querySelector('.view-tab[data-view="list"]').click();
      filterDateStart = dateStr;
      filterDateEnd = dateStr;
      document.getElementById('searchDateStartInput').value = dateStr;
      document.getElementById('searchDateEndInput').value = dateStr;
      editingId = id;
      renderResponses();
    });
  });
}

document.getElementById('calDetailToListBtn').addEventListener('click', () => {
  const dateStr = calSelectedDate;
  if(!dateStr) return;
  document.querySelector('.view-tab[data-view="list"]').click();
  filterDateStart = dateStr;
  filterDateEnd = dateStr;
  document.getElementById('searchDateStartInput').value = dateStr;

// ------------------------------------------------------------------
// 상담일지관리 ("상담일지" 시트: 상담유형/상담날짜/이름/성별/학년/출신 지역/중학교/
// 내신성적(등수)/연락처(학생)/연락처(보호자)/입학의지(상담이후)/내담자/상담자/상담요약)
// ------------------------------------------------------------------
let logs = [];
let logFilterName = '';
let logFilterSchool = '';
let logFilterCounselor = '';
let logFilterDateStart = '';
let logFilterDateEnd = '';
let logSortMode = 'recent';
let logSortReverse = false;

const LOG_CONSULT_TYPE_OPTIONS = ['방문','전화'];
const LOG_GENDER_OPTIONS = ['남','여'];
const LOG_WILL_OPTIONS = ['강함','상','중상','중','중하','하'];

onSnapshot(collection(db, 'counselingLogs'), snap => {
  logs = snap.docs.map(d => ({ id:d.id, ...d.data() }));
  renderLogs();
  if(openLogName) renderLogCardModal();
});

function logCountForName(name){
  return logs.filter(l => l.name === name).length;
}

function logRowHtml(r){
  const preview = String(r.summary||'').slice(0, 40);
  return `
    <tr>
      <td>${formatDate(r.date)}</td>
      <td><span class="chip">${escapeHtml(r.consultType||'')}</span></td>
      <td>
        <span class="name-link" data-lognameclick="${escapeHtml(r.name||'')}">${escapeHtml(r.name||'')}</span>
        <span class="log-count-badge ${logCountForName(r.name)<=1 ? 'zero':''}">${logCountForName(r.name)}회</span>
      </td>
      <td>${escapeHtml(r.grade||'')}</td>
      <td>${escapeHtml(r.middleSchool||'')}</td>
      <td>${escapeHtml(r.counselor||'')}</td>
      <td>${escapeHtml(preview)}${(r.summary||'').length > 40 ? '…' : ''}</td>
      <td><button class="btn danger small" data-logdel="${r.id}">삭제</button></td>
    </tr>
  `;
}

function renderLogs(){
  const wrap = document.getElementById('logList');

  const filtered = logs.filter(r => {
    if(logFilterName && !String(r.name||'').includes(logFilterName)) return false;
    if(logFilterSchool && !String(r.middleSchool||'').includes(logFilterSchool)) return false;
    if(logFilterCounselor && !String(r.counselor||'').includes(logFilterCounselor)) return false;
    if(logFilterDateStart && r.date < logFilterDateStart) return false;
    if(logFilterDateEnd && r.date > logFilterDateEnd) return false;
    return true;
  });

  if(filtered.length === 0){
    wrap.innerHTML = logs.length === 0
      ? '<p class="empty">아직 등록된 상담일지가 없습니다.</p>'
      : '<p class="empty">조건에 맞는 상담일지가 없습니다.</p>';
    return;
  }

  let sorted;
  if(logSortMode === 'name'){
    sorted = [...filtered].sort((a,b) => String(a.name||'').localeCompare(String(b.name||''), 'ko'));
  } else if(logSortMode === 'date'){
    sorted = [...filtered].sort((a,b) => String(a.date||'').localeCompare(String(b.date||'')));
  } else {
    sorted = [...filtered].sort((a,b) => {
      const ta = a.createdAt?.toMillis ? a.createdAt.toMillis() : 0;
      const tb = b.createdAt?.toMillis ? b.createdAt.toMillis() : 0;
      return tb - ta;
    });
  }
  if(logSortReverse) sorted.reverse();

  wrap.innerHTML = `
    <div class="table-scroll">
    <table id="logTable" class="data-table">
      <thead><tr>
        <th>상담날짜</th><th>상담유형</th><th>이름</th><th>학년</th><th>중학교</th><th>상담자</th><th>상담요약</th><th></th>
      </tr></thead>
      <tbody>${sorted.map(logRowHtml).join('')}</tbody>
    </table>
    </div>
  `;

  wrap.querySelectorAll('[data-logdel]').forEach(btn => {

const LOG_FORM_FIELDS = [
  ['consultType','상담유형','select', LOG_CONSULT_TYPE_OPTIONS],
  ['date','상담날짜','date'],
  ['gender','성별','select', LOG_GENDER_OPTIONS],
  ['grade','학년','text'],
  ['region','출신 지역','text'],
  ['middleSchool','중학교','text'],
  ['gradeRank','내신성적(등수)','text'],
  ['studentPhone','연락처(학생)','text'],
  ['guardianPhone','연락처(보호자)','text'],
  ['admissionWill','입학의지','select', LOG_WILL_OPTIONS],
  ['visitor','내담자','text'],
  ['counselor','상담자','text'],
];

function logFormGridHtml(entry, idPrefix){
  return LOG_FORM_FIELDS.map(([field, label, type, opts]) => {
    const val = escapeHtml(entry[field] || '');
    const input = type === 'select'
      ? selectHtml(field, entry[field]||'', opts)
      : `<input class="cell-input" type="${type}" data-field="${field}" value="${val}">`;
    return `<div class="log-field"><label>${label}</label>${input}</div>`;
  }).join('');
}

function renderLogCardModal(){
  const entries = logs.filter(l => l.name === openLogName)
    .sort((a,b) => String(a.date||'').localeCompare(String(b.date||'')));

  document.getElementById('logCardName').textContent = openLogName;
  const latest = entries[entries.length-1] || {};
  document.getElementById('logCardSub').textContent = [latest.middleSchool, latest.grade ? `${latest.grade}학년` : '', latest.counselor].filter(Boolean).join(' · ');
  document.getElementById('logCardCount').textContent = `총 ${entries.length}회`;

  const listEl = document.getElementById('logCardList');
  if(entries.length === 0){
    listEl.innerHTML = '<p class="log-empty">아직 등록된 상담 기록이 없습니다. 아래에서 첫 상담 기록을 추가해주세요.</p>';
  } else {
  listEl.innerHTML = entries.map((entry, idx) => {
    const seq = idx + 1;
    const isEditing = logModalEditingId === entry.id;
    if(isEditing){
      return `
        <div class="log-entry" data-logentry="${entry.id}">
          <div class="log-entry-head">
            <div style="display:flex; align-items:center; gap:8px;">
              <span class="log-seq">${seq}차</span>
            </div>
            <div class="log-entry-actions">
              <button data-logmodalcancel="${entry.id}">취소</button>
            </div>
          </div>
          <div class="log-expand-grid">${logFormGridHtml(entry)}</div>
          <div class="log-field" style="margin-bottom:10px;">
            <label>상담요약</label>
            <textarea class="log-content-edit" data-field="summary">${escapeHtml(entry.summary||'')}</textarea>
          </div>
          <div style="display:flex; justify-content:flex-end;">
            <button class="btn small" data-logmodalsave="${entry.id}">저장</button>
          </div>
        </div>
      `;
    }
    return `
      <div class="log-entry">
        <div class="log-entry-head">
          <div style="display:flex; align-items:center; gap:8px;">
            <span class="log-seq">${seq}차</span>
            <span class="log-date">${escapeHtml(entry.date||'')} · ${escapeHtml(entry.consultType||'')}${entry.counselor ? ' · '+escapeHtml(entry.counselor) : ''}</span>
          </div>
          <div class="log-entry-actions">
            <button data-logmodaledit="${entry.id}">수정</button>
            <button data-logmodaldel="${entry.id}">삭제</button>
          </div>
        </div>
        <div class="log-content">${escapeHtml(entry.summary||'') || '(작성된 상담요약 없음)'}</div>
      </div>
    `;
  }).join('');
  }

  listEl.querySelectorAll('[data-logmodaledit]').forEach(btn => {
    btn.addEventListener('click', () => {
      logModalEditingId = btn.getAttribute('data-logmodaledit');
      renderLogCardModal();
    });
  });
  listEl.querySelectorAll('[data-logmodalcancel]').forEach(btn => {
    btn.addEventListener('click', () => {
      logModalEditingId = null;
      renderLogCardModal();
    });
  });
  listEl.querySelectorAll('[data-logmodalsave]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-logmodalsave');
      const entryEl = listEl.querySelector(`.log-entry[data-logentry="${id}"]`);
      const fields = {};
      entryEl.querySelectorAll('[data-field]').forEach(el => {
        fields[el.getAttribute('data-field')] = el.value.trim();
      });
      await updateDoc(doc(db, 'counselingLogs', id), fields);
      logModalEditingId = null;
      if(fields.name && fields.name !== openLogName) openLogName = fields.name;
    });
  });
  listEl.querySelectorAll('[data-logmodaldel]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if(!confirm('이 상담 기록을 삭제할까요?')) return;
      await deleteDoc(doc(db, 'counselingLogs', btn.getAttribute('data-logmodaldel')));
    });
  });

  // 추가 폼: 신규 학생이면 상담신청목록에서 넘어온 정보(seed)로, 아니면 최근 기록 값으로 기본 채움
  const addGrid = document.getElementById('logAddGrid');
  const useSeed = entries.length === 0 && logAddSeed && logAddSeedName === openLogName;
  const base = useSeed ? logAddSeed : latest;
  addGrid.innerHTML = logFormGridHtml({ ...base, date: useSeed ? (base.date||'') : '' });
  document.getElementById('logNewContent').value = '';
  document.getElementById('logNextSeqLabel').textContent = `${entries.length+1}차 상담 등록`;
}

document.getElementById('logImportFileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('logImportStatus');
  statusEl.style.display = 'block';
  statusEl.textContent = '엑셀 파일을 읽는 중...';

  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:'array', cellDates:true });
    const sheetName = wb.SheetNames.find(n => n.includes('상담일지')) || wb.SheetNames[0];
    const sheet = wb.Sheets[sheetName];
    const sheetRows = XLSX.utils.sheet_to_json(sheet, { defval:'' });

    const targetRows = sheetRows.filter(row => String(row['이름'] || '').trim());
    if(targetRows.length === 0){
      statusEl.textContent = `"${sheetName}" 시트에서 이름이 있는 행을 찾지 못했습니다. 컬럼명을 확인해주세요.`;
      e.target.value = '';
      return;
    }
    if(!confirm(`"${sheetName}" 시트에서 ${targetRows.length}건을 찾았습니다. 불러올까요? (이름·날짜·상담자가 같은 건은 건너뜁니다)`)){
      e.target.value = '';
      return;
    }

    let success = 0, duplicate = 0, needsReview = [];

    for(const row of targetRows){
      const name = String(row['이름']).trim();
      const dateStr = parseExcelDate(row['상담날짜']);
      const counselor = String(row['상담자'] || '').trim();

      if(!dateStr){
        needsReview.push(`${name} (날짜 확인 필요)`);
        continue;
      }

      const isDuplicate = logs.some(r => r.name === name && r.date === dateStr && r.counselor === counselor);
      if(isDuplicate){ duplicate++; continue; }

      const gradeRaw = row['학년'];
      const grade = gradeRaw === '' || gradeRaw === undefined ? '' : String(Math.round(Number(gradeRaw)));

      const payload = {
        consultType: String(row['상담유형'] || '').trim(),
        date: dateStr,
        name,
        gender: String(row['성별'] || '').trim(),
        grade,
        region: String(row['출신 지역'] || '').trim(),
        middleSchool: String(row['중학교'] || '').trim(),
        gradeRank: String(row['내신성적 (등수)'] || '').trim(),
        studentPhone: String(row['연락처(학생)'] || '').trim(),
        guardianPhone: String(row['연락처(보호자)'] || '').trim(),
        admissionWill: String(row['입학의지 (상담이후)'] || '').trim(),
        visitor: String(row['내담자'] || '').trim(),
        counselor,
        summary: String(row['상담요약'] || '').trim(),
        createdAt: serverTimestamp()
      };

      try{
        await addDoc(collection(db, 'counselingLogs'), payload);
        logs.push(payload);
        success++;
      }catch(err){
        needsReview.push(`${name} (저장 실패)`);
      }
    }

    let msg = `${success}건 가져오기 완료`;
    if(duplicate > 0) msg += ` · ${duplicate}건은 이미 등록되어 건너뜀`;
    if(needsReview.length > 0) msg += ` · 확인 필요 ${needsReview.length}건: ${needsReview.join(', ')}`;
    statusEl.textContent = msg;
  }catch(err){
    statusEl.textContent = '엑셀 파일을 읽는 중 오류가 발생했습니다: ' + err.message;
  }
  e.target.value = '';
});

function formatDate(dateStr){
  if(!dateStr) return '';
  const [y,m,d] = dateStr.split('-').map(Number);
  const days = ['일','월','화','수','목','금','토'];
  const dow = days[new Date(y, m-1, d).getDay()];
  return `${m}월 ${d}일(${dow})`;
}
function formatDateTime(ts){
  if(!ts?.toDate) return '';
  const d = ts.toDate();
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  return `${d.getMonth()+1}월 ${d.getDate()}일 ${hh}:${mm}`;
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ------------------------------------------------------------------
// 엑셀 불러오기 ("신입학상담신청" 시트 기준 — 컬럼명이 다르면 못 읽어옵니다)
// ------------------------------------------------------------------
function pad2(n){ return String(n).padStart(2,'0'); }

function parseExcelDate(v){
  if(v instanceof Date && !isNaN(v)){
    return `${v.getFullYear()}-${pad2(v.getMonth()+1)}-${pad2(v.getDate())}`;
  }
  const s = String(v ?? '').trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(m){
    let mo = parseInt(m[1]), d = parseInt(m[2]), y = parseInt(m[3]);
    if(y < 100) y += 2000;
    return `${y}-${pad2(mo)}-${pad2(d)}`;
  }
  return null;
}

function normalizeTime(raw){
  const s = String(raw ?? '').trim();
  if(s.replace(/\s/g,'') === '시간협의필요') return '시간협의필요';
  const m = s.match(/(오전|오후)\s*(\d{1,2}):00\s*~\s*(\d{1,2}):00/);
  if(m) return `${m[1]} ${parseInt(m[2])}시~${parseInt(m[3])}시`;
  return null;
}

function normalizeMethod(raw){
  const s = String(raw ?? '').replace(/\s/g,'');
  if(s.includes('대면')) return '대면상담(학교방문)';
  if(s.includes('전화')) return '전화상담';
  return '';
}

function normalizeGrade(raw){
  const s = String(raw ?? '');
  if(s.includes('1학년')) return '1학년';
  if(s.includes('2학년')) return '2학년';
  if(s.includes('3학년')) return '3학년';
  return s.trim() ? '기타' : '';
}

function normalizeGender(raw){
  const s = String(raw ?? '').trim();
  if(s === '여') return '여학생';
  if(s === '남') return '남학생';
  return '';
}

    }

    let msg = `${success}건 가져오기 완료`;
    if(duplicate > 0) msg += ` · ${duplicate}건은 이미 등록되어 건너뜀`;
    if(needsReview.length > 0) msg += ` · 확인 필요 ${needsReview.length}건: ${needsReview.join(', ')}`;
    statusEl.textContent = msg;
  }catch(err){
    statusEl.textContent = '엑셀 파일을 읽는 중 오류가 발생했습니다: ' + err.message;
  }
  e.target.value = '';
});
</script>
</body>
</html>
