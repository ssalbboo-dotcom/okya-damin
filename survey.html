<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학교 방문 개별 상담 신청</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css">
<style>
  :root{
    --bg:#FAFAF7;
    --paper:#FFFFFF;
    --ink:#22262B;
    --ink-soft:#5B584F;
    --line:#DAD6CB;
    --green:#2F5233;
    --green-soft:#3F7B4F;
    --green-tint:#EAF1EA;
    --red:#C1440E;
    --red-tint:#FBEAE3;
    --muted:#9C9890;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(47,82,51,0.045) 28px),
      var(--bg);
    color:var(--ink);
    font-family:'Pretendard', -apple-system, sans-serif;
  }
  .wrap{max-width:480px; margin:0 auto; padding:36px 20px 60px;}
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--green-soft); margin:0 0 6px; text-align:center;
  }
  h1{
    font-family:'Gowun Batang', serif;
    font-size:24px; text-align:center; margin:0 0 6px; line-height:1.35;
  }
  .sub{color:var(--ink-soft); font-size:14px; text-align:center; margin:0 0 28px; line-height:1.6;}

  .card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:24px; margin-bottom:18px;
  }
  .section-label{
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--green-soft); margin:0 0 14px; font-weight:600;
  }
  .field{margin-bottom:16px;}
  .field:last-child{margin-bottom:0;}
  label.field-label{
    display:block; font-size:13px; font-weight:600; margin-bottom:8px; color:var(--ink);
  }
  input[type=text], input[type=tel]{
    width:100%; font-family:'Pretendard'; font-size:15px;
    padding:11px 12px; border:1px solid var(--line); border-radius:8px;
    background:var(--bg); color:var(--ink);
  }
  select{
    width:100%; font-family:'IBM Plex Mono', monospace; font-size:15px;
    padding:11px 12px; border:1px solid var(--line); border-radius:8px;
    background:var(--bg); color:var(--ink); appearance:none;
    background-image:linear-gradient(45deg, transparent 50%, var(--ink-soft) 50%), linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%);
    background-position: calc(100% - 18px) calc(50% - 3px), calc(100% - 13px) calc(50% - 3px);
    background-size:5px 5px; background-repeat:no-repeat;
  }
  input:focus, select:focus{outline:2px solid var(--green-soft); outline-offset:1px;}
  .date-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .hint{font-size:12px; color:var(--muted); margin-top:6px;}
  .empty{color:var(--muted); font-size:14px; text-align:center; padding:14px 0;}

  .btn-submit{
    width:100%; padding:14px; font-size:15px; font-weight:700;
    border-radius:9px; border:1px solid var(--green); background:var(--green);
    color:#fff; cursor:pointer;
  }
  .btn-submit:disabled{background:var(--muted); border-color:var(--muted); cursor:not-allowed;}
  .btn-submit:not(:disabled):hover{background:var(--green-soft); border-color:var(--green-soft);}

  .done-card{text-align:center; padding:40px 24px;}
  .done-icon{
    width:52px; height:52px; border-radius:50%; background:var(--green-tint); color:var(--green);
    display:flex; align-items:center; justify-content:center; font-size:24px; margin:0 auto 16px;
  }
  .done-title{font-family:'Gowun Batang', serif; font-size:20px; margin:0 0 8px;}
  .done-detail{color:var(--ink-soft); font-size:14px; line-height:1.8; margin:0 0 20px; text-align:left;}
  .done-detail b{color:var(--ink);}
  .chip-static{
    display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:12px;
    background:var(--green-tint); color:var(--green); border-radius:6px; padding:3px 8px;
  }

  #configNotice{
    max-width:480px; margin:20px auto 0; padding:14px 18px;
    background:var(--red-tint); border:1px solid #E9C4B0; border-radius:var(--radius);
    font-size:13px; line-height:1.6; display:none;
  }
  #configNotice code{background:#fff; padding:1px 5px; border-radius:4px;}
</style>
</head>
<body>

<div id="configNotice"></div>

<div class="wrap">
  <p class="eyebrow">개별 상담 신청</p>
  <h1 id="titleText">개별 상담 신청</h1>
  <p class="sub">학생·학부모님 정보를 입력하고, 희망하는 상담 방법과 날짜·시간을 선택해주세요.</p>

  <div id="formArea">
    <div class="card">
      <p class="section-label">신청자 정보</p>
      <div class="field">
        <label class="field-label">학생 성명</label>
        <input type="text" id="studentNameInput" placeholder="이름을 입력하세요">
      </div>
      <div class="field date-row">
        <div>
          <label class="field-label">성별</label>
          <select id="genderSelect">
            <option value="">선택</option>
            <option value="남학생">남학생</option>
            <option value="여학생">여학생</option>
          </select>
        </div>
        <div>
          <label class="field-label">학년</label>
          <select id="gradeInput">
            <option value="">선택</option>
            <option value="1학년">1학년</option>
            <option value="2학년">2학년</option>
            <option value="3학년">3학년</option>
            <option value="기타">기타</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label class="field-label">학교 이름</label>
        <input type="text" id="schoolNameInput" placeholder="재학 중인 학교명">
      </div>
      <div class="field">
        <label class="field-label">학교 소재지</label>
        <input type="text" id="schoolLocationInput" placeholder="예: 경상남도 창녕군">
      </div>
      <div class="field">
        <label class="field-label">학부모님 연락처</label>
        <input type="tel" id="parentPhoneInput" placeholder="010-0000-0000">
      </div>
      <div class="field date-row">
        <div>
          <label class="field-label">방문인원</label>
          <select id="visitorCountInput">
            <option value="">선택</option>
            <option value="1명">1명</option>
            <option value="2명">2명</option>
            <option value="3명">3명</option>
            <option value="4명">4명</option>
            <option value="5명 이상">5명 이상</option>
          </select>
        </div>
        <div>
          <label class="field-label">상담방법</label>
          <select id="consultMethodSelect">
            <option value="">선택</option>
            <option value="대면상담(학교방문)">대면상담(학교방문)</option>
            <option value="전화상담">전화상담</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card">
      <p class="section-label">희망 상담 날짜·시간</p>
      <div class="field date-row">
        <div>
          <label class="field-label">월</label>
          <select id="monthSelect"><option value="">선택</option></select>
        </div>
        <div>
          <label class="field-label">일</label>
          <select id="daySelect"><option value="">월을 먼저 선택</option></select>
        </div>
      </div>
      <div class="field">
        <label class="field-label">희망 시간</label>
        <select id="timeSelect" disabled><option value="">날짜를 먼저 선택하세요</option></select>
        <p class="hint" style="margin-top:6px; font-size:13px; color:#22262B; line-height:1.6;">(이미 상담이 예정되어 있는 시간은 보여지지 않습니다.)<br>평일 상담은 오후 7시~8시 한 타임으로 운영하며, 상담 신청은 12월 6일까지 받습니다.</p>
        <p class="hint" style="margin-top:4px; font-size:13px; color:#C1440E; font-weight:600; line-height:1.6;">대면 상담(학교방문)의 경우에는 당일 신청 및 접수는 받지 않습니다.</p>
      </div>
    </div>

    <div class="card">
      <p class="section-label">개인정보 수집 및 이용 동의</p>
      <div class="field">
        <label class="field-label">개인정보 수집 및 이용에 동의합니까? 미동의 시 상담 진행에 제한이 있을 수 있습니다.</label>
        <select id="consentSelect">
          <option value="">선택</option>
          <option value="동의합니다">동의합니다</option>
          <option value="미동의합니다">미동의합니다</option>
        </select>
      </div>
    </div>

    <button class="btn-submit" id="submitBtn" disabled>신청하기</button>
  </div>

  <div class="card done-card" id="doneArea" style="display:none;">
    <div class="done-icon">✓</div>
    <p class="done-title">신청이 접수되었습니다</p>
    <p class="done-detail" id="doneDetail"></p>
    <button class="btn-submit" id="resetBtn" style="background:transparent; color:var(--green); border:1px solid var(--green);">다시 신청하기</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, doc, onSnapshot, serverTimestamp, runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ------------------------------------------------------------------
// admin.html 과 "완전히 동일한" firebaseConfig 값을 넣어야 합니다.
// ------------------------------------------------------------------
const firebaseConfig = {
  apiKey: "AIzaSyCN5n1YDtZSmTB5en3P3FXY_jAMBB-h_YA",
  authDomain: "okya-admin.firebaseapp.com",
  projectId: "okya-admin",
  storageBucket: "okya-admin.firebasestorage.app",
  messagingSenderId: "226340731611",
  appId: "1:226340731611:web:f9621ec1462bd9d6e02afe"
};

const isConfigured = !firebaseConfig.apiKey.includes("YOUR_");
if(!isConfigured){
  const n = document.getElementById('configNotice');
  n.style.display = 'block';
  n.innerHTML = `<strong>설정이 필요합니다.</strong> 이 파일 하단의 <code>firebaseConfig</code> 값을 admin.html 과 동일하게 넣어주세요.`;
}

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ------------------------------------------------------------------
// 희망 시간 고정 옵션
// ------------------------------------------------------------------
// 주말 상담 시간 (정원제)
const FIXED_TIME_OPTIONS = ['오전 10시~11시','오후 1시~2시','오후 3시~4시'];
// 평일 상담 시간 (1타임, 인원 제한 없음)
const WEEKDAY_TIME_OPTIONS = ['오후 7시~8시'];

// 신청 마감일
const LAST_APPLY_DATE = { month: 12, day: 6 };
// 이 날짜부터 주말 기본 정원을 3팀으로
const WEEKEND_3TEAM_FROM = { month: 11, day: 22 };
// 특정 날짜에만 열리는 시간 (인원 제한 없음, 해당 시간만 신청 가능)
const SPECIAL_DAY_SLOTS = {
  '12-5': ['오후 2시~4시'],
  '12-6': ['오후 2시~4시']
};

// 자체 행사로 상담이 불가능한 날짜 (월/일 기준 - 아예 날짜 선택지에서 제외)
const BLOCKED_MONTH_DAYS = [
  [9,23],[9,24],[9,25],[9,26],[9,27],[9,30],
  [10,7],[10,8],[10,9],[10,13],[10,14],[10,15],[10,24],
  [11,4],[11,14],[11,15],[11,19],[11,21]
];


onSnapshot(doc(db, 'config', 'meta'), snap => {
  const name = snap.exists() && snap.data().eventName ? snap.data().eventName : '개별 상담 신청';
  document.getElementById('titleText').textContent = name;
});

// 시간대별 신청 수 (slotCounts: 이름·연락처 없이 날짜·시간·신청 수만 담김, 누구나 읽을 수 있음)
let slotMap = new Map();
let slotsLoaded = false, slotsError = false;
onSnapshot(collection(db, 'slotCounts'), snap => {
  slotMap = new Map(snap.docs.map(d => [d.id, d.data()]));
  slotsLoaded = true;
  slotsError = false;
  populateTimes();
}, err => {
  console.error('신청 현황 읽기 실패', err);
  slotsLoaded = false;
  slotsError = true;
  populateTimes();
});
const slotIdOf = (dateStr, time) => `${dateStr}_${time}`;

const monthSelect = document.getElementById('monthSelect');
const daySelect = document.getElementById('daySelect');
const timeSelect = document.getElementById('timeSelect');
const submitBtn = document.getElementById('submitBtn');

const requiredInputs = [
  'studentNameInput','genderSelect','gradeInput','schoolNameInput','schoolLocationInput',
  'parentPhoneInput','visitorCountInput','consultMethodSelect','consentSelect'
].map(id => document.getElementById(id));
requiredInputs.forEach(el => el.addEventListener('input', updateSubmitState));
requiredInputs.forEach(el => el.addEventListener('change', updateSubmitState));

// 학부모님 연락처 - 입력하는 대로 자동으로 하이픈(-) 삽입
function formatPhoneNumber(value){
  const digits = value.replace(/\D/g, '').slice(0, 11);
  if(digits.startsWith('02')){
    if(digits.length <= 2) return digits;
    if(digits.length <= 5) return `${digits.slice(0,2)}-${digits.slice(2)}`;
    if(digits.length <= 9) return `${digits.slice(0,2)}-${digits.slice(2,5)}-${digits.slice(5)}`;
    return `${digits.slice(0,2)}-${digits.slice(2,6)}-${digits.slice(6,10)}`;
  }
  if(digits.length <= 3) return digits;
  if(digits.length <= 7) return `${digits.slice(0,3)}-${digits.slice(3)}`;
  if(digits.length <= 10) return `${digits.slice(0,3)}-${digits.slice(3,6)}-${digits.slice(6)}`;
  return `${digits.slice(0,3)}-${digits.slice(3,7)}-${digits.slice(7,11)}`;
}
document.getElementById('parentPhoneInput').addEventListener('input', (e) => {
  e.target.value = formatPhoneNumber(e.target.value);
});

function pad(n){ return String(n).padStart(2,'0'); }

// 이 신청서는 8월~12월만 다루므로 항상 올해 연도를 사용 (다음 해로 넘기지 않음)
function resolveYear(month){
  return new Date().getFullYear();
}

function daysInMonth(year, month){
  return new Date(year, month, 0).getDate();
}

function currentDateStr(){
  const month = parseInt(monthSelect.value);
  const day = parseInt(daySelect.value);
  if(!month || !day) return null;
  const year = resolveYear(month);
  return `${year}-${pad(month)}-${pad(day)}`;
}

// ---------- 신청 가능 날짜 판단 ----------
function todayYMD(){
  const t = new Date();
  return { y: t.getFullYear(), m: t.getMonth()+1, d: t.getDate() };
}
function ymdNum(m, d){ return m*100 + d; }

// 대면 상담(학교방문)은 당일 신청 불가
const consultMethodSelect = document.getElementById('consultMethodSelect');
function isFaceToFace(){ return consultMethodSelect.value.includes('대면'); }

// 오늘 이후 ~ 12월 6일까지, 막힌 날짜 제외 (대면 상담이면 오늘도 제외)
function isSelectableDate(year, month, day){
  const t = todayYMD();
  const n = ymdNum(month, day);
  if(n < ymdNum(t.m, t.d)) return false;
  if(n === ymdNum(t.m, t.d) && isFaceToFace()) return false;
  if(n > ymdNum(LAST_APPLY_DATE.month, LAST_APPLY_DATE.day)) return false;
  return !isBlockedDate(year, month, day);
}
function isWeekend(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dow = new Date(y, m-1, d).getDay();
  return dow === 0 || dow === 6;
}
function weekendBaseCapacity(dateStr){
  const [, m, d] = dateStr.split('-').map(Number);
  return ymdNum(m, d) >= ymdNum(WEEKEND_3TEAM_FROM.month, WEEKEND_3TEAM_FROM.day) ? 3 : 2;
}

// 선택한 날짜에 신청 가능한 시간 목록
function normTime(s){
  return String(s||'').replace(/\s+/g,'').replace(/[～〜~]/g,'~');
}

function availableTimesFor(dateStr){
  const [, sm, sd] = dateStr.split('-').map(Number);
  const special = SPECIAL_DAY_SLOTS[`${sm}-${sd}`];
  if(special) return special.slice();                             // 특정 날짜: 지정 시간만, 인원 제한 없음
  if(!isWeekend(dateStr)) return WEEKDAY_TIME_OPTIONS.slice();   // 평일: 인원 제한 없음
  const base = weekendBaseCapacity(dateStr);
  return FIXED_TIME_OPTIONS.filter(t => {
    const s = slotMap.get(slotIdOf(dateStr, t)) || {};
    const count = s.count || 0;
    // 관리자가 그 시간대 신청 건에 "허용"을 누를 때마다 1팀씩 더 받는다
    const capacity = base + (s.extra || 0);
    return count < capacity;
  });
}

// ---------- 월 / 일 드롭다운 (오늘 ~ 12월 6일, 신청 가능한 날짜가 있는 달만) ----------
function populateMonths(){
  monthSelect.disabled = false;
  const year = new Date().getFullYear();
  const t = todayYMD();
  const months = [];
  for(let m = t.m; m <= LAST_APPLY_DATE.month; m++){
    const n = daysInMonth(year, m);
    for(let d = 1; d <= n; d++){
      if(isSelectableDate(year, m, d)){ months.push(m); break; }
    }
  }
  monthSelect.innerHTML = months.length
    ? '<option value="">선택</option>' + months.map(m => `<option value="${m}">${m}월</option>`).join('')
    : '<option value="">신청 기간이 종료되었습니다</option>';
  if(!months.length) monthSelect.disabled = true;
}

function populateDays(){
  const month = parseInt(monthSelect.value);
  if(!month){
    daySelect.innerHTML = '<option value="">월을 먼저 선택</option>';
    populateTimes();
    return;
  }
  const year = resolveYear(month);
  const n = daysInMonth(year, month);
  const days = Array.from({length:n}, (_,i) => i+1)
    .filter(d => isSelectableDate(year, month, d));
  daySelect.innerHTML = '<option value="">선택</option>' +
    days.map(d => `<option value="${d}">${d}일</option>`).join('');
  populateTimes();
}

populateMonths();
monthSelect.addEventListener('change', populateDays);

// 상담방법을 바꾸면 날짜 목록을 다시 만든다 (이미 고른 월·일이 여전히 가능하면 그대로 유지)
consultMethodSelect.addEventListener('change', () => {
  const prevMonth = monthSelect.value, prevDay = daySelect.value;
  populateMonths();
  if(prevMonth && [...monthSelect.options].some(o => o.value === prevMonth)){
    monthSelect.value = prevMonth;
    populateDays();
    if(prevDay && [...daySelect.options].some(o => o.value === prevDay)){
      daySelect.value = prevDay;
      populateTimes();
    } else if(prevDay){
      alert('대면 상담(학교방문)은 당일 신청을 받지 않습니다. 다른 날짜를 선택해주세요.');
    }
  } else {
    daySelect.innerHTML = '<option value="">월을 먼저 선택</option>';
    populateTimes();
    if(prevMonth) alert('대면 상담(학교방문)은 당일 신청을 받지 않습니다. 다른 날짜를 선택해주세요.');
  }
});

function isBlockedDate(year, month, day){
  return BLOCKED_MONTH_DAYS.some(([m,d]) => m === month && d === day);
}

daySelect.addEventListener('change', populateTimes);
timeSelect.addEventListener('change', updateSubmitState);

function populateTimes(){
  const dateStr = currentDateStr();
  if(!dateStr){
    timeSelect.disabled = true;
    timeSelect.innerHTML = '<option value="">날짜를 먼저 선택하세요</option>';
    updateSubmitState();
    return;
  }
  if(!slotsLoaded){
    timeSelect.disabled = true;
    timeSelect.innerHTML = slotsError
      ? '<option value="">신청 현황을 불러오지 못했습니다. 새로고침 해주세요</option>'
      : '<option value="">신청 현황을 불러오는 중입니다...</option>';
    updateSubmitState();
    return;
  }

  const available = availableTimesFor(dateStr);
  if(available.length === 0){
    timeSelect.disabled = true;
    timeSelect.innerHTML = '<option value="">이 날짜는 신청이 마감되었습니다</option>';
    updateSubmitState();
    return;
  }

  timeSelect.disabled = false;
  timeSelect.innerHTML = '<option value="">선택</option>' +
    available.map(t => `<option value="${escapeAttr(t)}">${escapeHtml(t)}</option>`).join('');
  updateSubmitState();
}

function updateSubmitState(){
  const filled = requiredInputs.every(el => el.value.trim());
  submitBtn.disabled = !(filled && currentDateStr() && timeSelect.value);
}

submitBtn.addEventListener('click', async () => {
  const dateStr = currentDateStr();
  const time = timeSelect.value;
  if(!dateStr || !time) return;

  // 날짜·시간·정원 확인 (실제 정원 확인은 아래 트랜잭션에서 한 번 더 함)
  const [, cm, cd] = dateStr.split('-').map(Number);
  if(!isSelectableDate(Number(dateStr.slice(0,4)), cm, cd) || !availableTimesFor(dateStr).includes(time)){
    alert('선택하신 날짜·시간은 마감되었거나 신청할 수 없습니다. 다른 날짜·시간을 선택해주세요.');
    populateTimes();
    return;
  }

  const payload = {
    studentName: document.getElementById('studentNameInput').value.trim(),
    gender: document.getElementById('genderSelect').value,
    grade: document.getElementById('gradeInput').value.trim(),
    schoolName: document.getElementById('schoolNameInput').value.trim(),
    schoolLocation: document.getElementById('schoolLocationInput').value.trim(),
    parentPhone: document.getElementById('parentPhoneInput').value.trim(),
    visitorCount: document.getElementById('visitorCountInput').value.trim(),
    consultMethod: document.getElementById('consultMethodSelect').value,
    privacyConsent: document.getElementById('consentSelect').value,
    date: dateStr,
    time,
    createdAt: serverTimestamp()
  };

  submitBtn.disabled = true;
  submitBtn.textContent = '접수 중...';
  // 정원 확인과 신청 저장을 한 번에 처리 (동시에 여러 명이 신청해도 정원을 넘지 않도록 트랜잭션 사용)
  try{
    const special = !!SPECIAL_DAY_SLOTS[`${cm}-${cd}`];
    const limited = isWeekend(dateStr) && !special;
    const base = weekendBaseCapacity(dateStr);
    const slotRef = doc(db, 'slotCounts', slotIdOf(dateStr, time));
    const respRef = doc(collection(db, 'responses'));
    // 서버가 응답하지 않거나 한도 초과로 계속 재시도하는 경우, 20초 뒤에는 멈추고 안내한다
    const tx = runTransaction(db, async tx => {
      const s = await tx.get(slotRef);
      const cur = s.exists() ? s.data() : null;
      const count = cur ? (cur.count || 0) : 0;
      if(limited && count >= base + ((cur && cur.extra) || 0)) throw new Error('FULL');
      tx.set(respRef, payload);
      if(cur) tx.update(slotRef, { count: count + 1 });
      else tx.set(slotRef, { date: dateStr, time, count: 1 });
    }, { maxAttempts: 3 });
    await Promise.race([tx, new Promise((_, rej) => setTimeout(() => rej(new Error('TIMEOUT')), 20000))]);
    showDone(payload);
  }catch(e){
    console.error('신청 저장 실패', e);
    if(e && (e.code === 'resource-exhausted' || e.message === 'TIMEOUT')){
      alert('지금은 신청이 접수되지 않습니다. 잠시 후 다시 시도해주세요.\n계속 안 되면 학교로 전화 주시면 상담 일정을 잡아드리겠습니다.');
      submitBtn.disabled = false;
      submitBtn.textContent = '신청하기';
      return;
    }
    if(e && e.message === 'FULL'){
      alert('선택하신 시간은 방금 정원이 마감되었습니다. 다른 시간을 선택해주세요.');
      submitBtn.disabled = false;
      submitBtn.textContent = '신청하기';
      populateTimes();
      return;
    }
    alert('신청 중 문제가 발생했습니다. 다시 시도해주세요.');
    submitBtn.disabled = false;
    submitBtn.textContent = '신청하기';
  }
});

function showDone(p){
  document.getElementById('formArea').style.display = 'none';
  document.getElementById('doneArea').style.display = 'block';
  const [,m,d] = p.date.split('-');
  document.getElementById('doneDetail').innerHTML = `
    <b>${escapeHtml(p.studentName)}</b> 학생 (${escapeHtml(p.grade)})<br>
    ${escapeHtml(p.schoolName)} · ${escapeHtml(p.consultMethod)}<br><br>
    희망 일시: <b>${parseInt(m)}월 ${parseInt(d)}일</b> &nbsp;
    <span class="chip-static">${escapeHtml(p.time)}</span>
  `;
}

document.getElementById('resetBtn').addEventListener('click', () => {
  document.getElementById('doneArea').style.display = 'none';
  document.getElementById('formArea').style.display = 'block';
  requiredInputs.forEach(el => el.value = '');
  populateMonths();
  monthSelect.value = '';
  daySelect.innerHTML = '<option value="">월을 먼저 선택</option>';
  populateTimes();
  submitBtn.textContent = '신청하기';
});

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){
  return String(s).replace(/"/g, '&quot;');
}
</script>
